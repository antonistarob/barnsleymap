<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Info</title>
<style>
body { font-family: Arial; background:#121212; color:#eee; margin:0; }
header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:#1f1f1f;
    position:fixed;   /* make header fixed so it stays on top */
    top:0;
    left:0;
    right:0;
    z-index:10;       /* higher than left column */
}
header h1 { margin:0; font-size:24px; }
.header-link { color:#fff; text-decoration:none; }
.header-link:hover { text-decoration:underline; }
.left-column {
    width:200px;
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    padding:50px 10px 10px 10px; /* space for header, first padding is gap between obj. on str. and header */
    border-right:1px solid #333;
    overflow-y:auto;
    background:#121212;
    z-index:5;
}
.objects-table { width:100%; border-collapse:collapse; }
.objects-table th, .objects-table td { padding:6px 8px; border-bottom:1px solid #555; text-align:left; }
.objects-table th { background:#1f1f1f; }
.object-link { cursor:pointer; text-decoration:none; color:inherit; }
.object-link:hover { text-decoration:underline; }
.main-content {
    margin-left:230px;
    padding:90px 20px 20px 20px; 
    display:flex;
    flex-direction:column;
    align-items:center;  /* center all content horizontally */
    text-align:center;   /* center text inside */
    max-width:900px;     /* optional: limit max width for readability */
    margin-left: auto;
    margin-right: auto;
}
h1 { margin-top:0; }
#objectStreetLine { font-size:22px; margin-bottom:10px; }
.info-line { margin:5px 0; }

.action-button { cursor:pointer; background:#333; color:#eee; border:1px solid #555; border-radius:5px; padding:6px 12px; font-size:14px; margin:5px; }
.action-button:hover { background:#444; }

.buttons-container { display:flex; justify-content:center; flex-wrap:wrap; margin:20px 0; }

#photosSection { margin-top:20px; width:100%; }
#photosDiv { display:flex; flex-wrap:wrap; justify-content:center; }

.popup-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:1000; }
.popup { background:#1f1f1f; padding:25px; border-radius:10px; width:400px; max-width:90%; border:1px solid #444; }
.popup h3 { text-align:center; margin-top:0; }
.popup label { display:block; margin-top:10px; }
.popup input[type="text"], .popup textarea, .popup select { width:100%; padding:5px; margin-top:5px; background:#2b2b2b; color:#eee; border:1px solid #555; border-radius:5px; }
.popup input[type="checkbox"] { margin-left:6px; transform:scale(1.1); }
.popup-buttons { margin-top:20px; display:flex; justify-content:space-between; }
#gradeOptions { display:none; margin-top:10px; }
#photosDiv img { cursor:pointer; }
#mapSection { margin:30px 0; width:100%; }
#objectMap { width:80%; height:400px; border:1px solid #555; border-radius:5px; margin:0 auto; }
#objectTitle {
    border: 2px solid #555;     /* border around the title */
    padding: 10px 100px;         /* space inside the box */
    border-radius: 8px;         /* rounded corners */
    background: #1f1f1f;        /* slightly lighter background for contrast */
    margin-bottom: 5px;        /* spacing below the box */
    display: inline-block;       /* shrink to fit text */
} 
#streetBox {
    border: 2px solid #aaa;      /* light border */
    background: #333;            /* lighter background */
    padding: 0px 100px;           /* spacing inside box */
    border-radius: 6px;          /* rounded corners */
    display: inline-block;       /* shrink to fit content */
    font-size: 20px;
}
#streetBox .object-link {
    color: #eee;                 /* ensure text is readable */
    text-decoration: none;
}
#streetBox .object-link:hover {
    text-decoration: underline;
}

</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>
<body>

<header>
    <h1><a href="index.html" class="header-link">Historical Interactive Map of Barnsley</a></h1>
</header>

<div class="left-column">
    <h2 id="objectsHeader"  style="text-align:center;">Objects on this street</h2>
    <table class="objects-table">
        <thead><tr><th>No.</th><th>Name</th></tr></thead>
        <tbody id="objectsTableBody"></tbody>
    </table>
</div>

<div class="main-content">
    <h1 id="objectTitle"></h1>
<p class="info-line" id="objectStreetLine">
    <span id="streetBox">
        <span id="objectStreet" class="object-link"></span>
        <span id="objectNumber" style="margin-left:5px;"></span>
    </span>
</p>

    <div id="additionalInfo"></div>

    <p id="descriptionWrapper"><strong>Description:</strong> <span id="objectDescription"></span></p>

    <div style="margin:20px 0;" text-align:center;"> <!-- size between buttons and desc. -->
        <button id="addPhotoBtn" class="action-button">Add Photo</button>
        <button id="editBtn" class="action-button">Edit</button>
        <button id="mapBtn" class="action-button">Map</button> 
        <button id="deleteBtn" class="action-button">Delete</button>
    </div>
    
    <!-- photos sect. -->
    <div id="photosSection" style="margin-top:20px;" text-align:center;">     
        <h3>Photos</h3>
        <div id="photosDiv" style="display:flex; flex-wrap:wrap;"></div>
    </div>
</div>

<!-- EDIT OBJECT POPUP -->
<div class="popup-overlay" id="editPopup">
    <div class="popup">
        <h3 id="popupTitle">Edit Object</h3>

        <label id="popupNameLabel">Object Name:</label>
        <input type="text" id="editObjectName">

        <label id="popupNumberLabel">Number:</label>
        <input type="text" id="editObjectNumber">

        <label>Object Category:</label>
        <select id="editCategory"></select> <!-- NEW DROPDOWN -->

        <label>Status:</label>
        <select id="editStatus">
            <option value="Exists" selected>Exists</option>
            <option value="Doesn't exist">Doesn't exist</option>
            <option value="To be demolished">To be demolished</option>
            <option value="Exists partially">Exists partially</option>
            <option value="In construction">In construction</option>
        </select>

        <label>Year Built:</label>
        <input type="text" id="editYearBuilt" placeholder="e.g. 1890">

        <label>Year Demolished:</label>
        <input type="text" id="editYearDemolished" placeholder="e.g. 1975">

        <label>Grade Listed:</label>
        <input type="checkbox" id="editGradeListed">
        <div id="gradeOptions">
            <label>Grade:</label>
            <select id="editGrade">
                <option value="Grade I">Grade I</option>
                <option value="Grade II*">Grade II*</option>
                <option value="Grade II">Grade II</option>
            </select>
            <label>List Entry Number:</label>
            <input type="text" id="editListEntryNumber">
            <label>Date first listed:</label>
            <input type="text" id="editDateListed">
        </div>

        <label>Description:</label>
        <textarea id="editDescription" rows="3"></textarea>

        <div class="popup-buttons">
            <button id="saveEditObject" class="action-button">Save</button>
            <button onclick="closeEdit()" class="action-button">Cancel</button>
        </div>
    </div>
</div>

<!-- OTHER POPUPS REMAIN SAME AS ORIGINAL -->

<script>
const OBJECT_CATEGORIES = [
    "Townhouse",
    "Detached house",
    "Semi-detached house",
    "Terraced house",
    "Villa",
    "Palace/Manor",
    "Cottage",
    "Single-family house",
    "Apartment block"
];

function populateCategorySelect(selectEl, currentCategory='') {
    selectEl.innerHTML = '';
    OBJECT_CATEGORIES.forEach(cat=>{
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        if(cat === currentCategory) opt.selected = true;
        selectEl.appendChild(opt);
    });
}

const editCategory = document.getElementById('editCategory');

/* WHEN OPENING EDIT POPUP */
editBtn.onclick=()=>{
    editPopup.style.display='flex';
    editObjectName.value=obj.name;
    editObjectNumber.value=obj.number||'';
    editStatus.value=obj.status||'Exists';
    editYearBuilt.value=obj.yearBuilt||'';
    editYearDemolished.value=obj.yearDemolished||'';
    editGradeListed.checked=obj.gradeListed||false;
    gradeOptions.style.display=editGradeListed.checked?'block':'none';
    editGrade.value=obj.grade||'Grade I';
    editListEntryNumber.value=obj.listEntryNumber||'';
    editDateListed.value=obj.dateListed||'';
    editDescription.value=obj.description||'';
    populateCategorySelect(editCategory, obj.category||''); // populate dropdown
};

/* SAVE EDIT OBJECT */
document.getElementById('saveEditObject').onclick = () => {
    const newName = editObjectName.value.trim() || obj.name;

    obj.name = newName;
    obj.number = editObjectNumber.value.trim();
    obj.category = editCategory.value; // save category
    obj.status = editStatus.value;
    obj.yearBuilt = editYearBuilt.value.trim();
    obj.yearDemolished = editYearDemolished.value.trim();
    obj.gradeListed = editGradeListed.checked;
    obj.grade = editGrade.value;
    obj.listEntryNumber = editListEntryNumber.value.trim();
    obj.dateListed = editDateListed.value.trim();
    obj.description = editDescription.value.trim();

    localStorage.setItem('streetObjects', JSON.stringify(streetObjects));

    window.location.href = `object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(newName)}`;
};

</script>

</body>
</html>
