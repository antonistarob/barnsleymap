<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Info</title>
<style>
body { font-family: Arial; background:#121212; color:#eee; margin:0; }

/* HEADER */
header { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:#1f1f1f; }
header h1 { margin:0; font-size:24px; }
.header-link { color:#fff; text-decoration:none; }
.header-link:hover { text-decoration:underline; }
.auth-buttons button { margin-left:10px; padding:5px 10px; cursor:pointer; background:#333; color:#eee; border:1px solid #555; border-radius:5px; }
.auth-buttons button:hover { background:#444; }

/* LEFT COLUMN */
.left-column { width:200px; position:fixed; top:40px; left:0; bottom:0; padding:10px; border-right:1px solid #333; overflow-y:auto; }
.objects-table { width:100%; border-collapse:collapse; }
.objects-table th, .objects-table td { padding:6px 8px; border-bottom:1px solid #555; text-align:left; }
.objects-table th { background:#1f1f1f; }
.object-link {
    cursor: pointer;
    color: inherit;
    text-decoration: none;
}
.object-link:hover {
    text-decoration: underline;
}

/* MAIN CONTENT */
.main-content { margin-left:230px; padding:20px; }
h1 { margin-top:0; }
.info-line { margin:5px 0; }

.action-button { cursor:pointer; background:#333; color:#eee; border:1px solid #555; border-radius:5px; padding:6px 12px; font-size:14px; }
.action-button:hover { background:#444; }

/* POPUPS */
.popup-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:1000; }
.popup { background:#1f1f1f; padding:25px; border-radius:10px; width:400px; max-width:90%; border:1px solid #444; }
.popup h3 { text-align:center; margin-top:0; }
.popup label { display:block; margin-top:10px; }
.popup input[type="text"], .popup textarea, .popup select { width:100%; padding:5px; margin-top:5px; background:#2b2b2b; color:#eee; border:1px solid #555; border-radius:5px; }
.popup input[type="checkbox"] { margin-left:6px; transform:scale(1.1); }
.popup-buttons { margin-top:20px; display:flex; justify-content:space-between; }
</style>
</head>
<body>

<header>
    <h1><a href="index.html" class="header-link">Historical Interactive Map of Barnsley</a></h1>
</header>

<div class="left-column">
    <h2>Objects on this street</h2>
    <table class="objects-table">
        <thead><tr><th>No.</th><th>Name</th></tr></thead>
        <tbody id="objectsTableBody"></tbody>
    </table>
</div>

<div class="main-content">
    <h1 id="objectTitle"></h1>
    <p class="info-line" id="objectStreetLine">
        <span id="objectStreet" class="object-link"></span>
        <span id="objectNumber" style="font-weight:bold; margin-left:5px;"></span>
    </p>
    <p id="existingWrapper" class="info-line"><strong>Status:</strong> <span id="objectExisting"></span></p>
    <p id="descriptionWrapper"><strong>Description:</strong> <span id="objectDescription"></span></p>

    <!-- Edit & Delete Buttons -->
    <div style="margin:15px 0;">
        <button id="editBtn" class="action-button">Edit</button>
        <button id="deleteBtn" class="action-button">Delete</button>
    </div>
</div>

<!-- Reuse the same popup as street page for Add/Edit Object -->
<div class="popup-overlay" id="editPopup">
    <div class="popup">
        <h3 id="popupTitle">Edit Object</h3>

        <label id="popupNameLabel">Object Name:</label>
        <input type="text" id="editStreetName">

        <label id="popupNumberLabel">Number:</label>
        <input type="text" id="editDistrict">

        <label>Status:</label>
        <select id="editExisting">
            <option value="Exists">Exists</option>
            <option value="Doesn't exist">Doesn't exist</option>
            <option value="To be demolished">To be demolished</option>
            <option value="Exists partially">Exists partially</option>
            <option value="In construction">In construction</option>
        </select>

        <label>Description:</label>
        <textarea id="editDescription" rows="3"></textarea>

        <div class="popup-buttons">
            <button id="saveEditStreet" class="action-button">Save</button>
            <button onclick="closeEdit()" class="action-button">Cancel</button>
        </div>
    </div>
</div>

<!-- Delete Popup -->
<div class="popup-overlay" id="deletePopup">
    <div class="popup">
        <p id="deleteMessage"></p>
        <div class="popup-buttons">
            <button id="confirmDelete" class="action-button">Yes</button>
            <button id="cancelDelete" class="action-button">No</button>
        </div>
    </div>
</div>

<script>
const qp = p => new URLSearchParams(location.search).get(p);
const streetName = qp('street');
let objectName = qp('object'); // use let so we can update it on rename

/* LOAD DATA */
let streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
let streetsData = JSON.parse(localStorage.getItem('streetsData')) || {};
let streets = JSON.parse(localStorage.getItem('streets')) || [];

/* FIND OBJECT */
const obj = (streetObjects[streetName] || []).find(o => o.name === objectName);
if(!obj){
    document.getElementById('objectTitle').textContent = 'Object not found';
    throw new Error('Object missing');
}

/* DISPLAY OBJECT INFO */
document.getElementById('objectTitle').textContent = obj.name;

/* street clickable + number bold */
const streetEl = document.getElementById('objectStreet');
streetEl.textContent = streetName;
streetEl.classList.add('object-link');
streetEl.onclick = () => {
    window.location.href = `street.html?name=${encodeURIComponent(streetName)}`;
};

document.getElementById('objectNumber').textContent = obj.number || 'N/A';

/* EXISTING AND DESCRIPTION LOGIC */
const existingWrapper = document.getElementById('existingWrapper');
const descriptionWrapper = document.getElementById('descriptionWrapper');

function updateStatusAndDescription() {
    // Status
    if(obj.existing && obj.existing !== 'Exists'){
        document.getElementById('objectExisting').textContent = obj.existing;
        existingWrapper.style.display = 'block';
    } else if(obj.existing === false || obj.existing === "Doesn't exist"){
        document.getElementById('objectExisting').textContent = obj.existing === false ? "Doesn't exist" : obj.existing;
        existingWrapper.style.display = 'block';
    } else {
        existingWrapper.style.display = 'none';
    }

    // Description
    if(obj.description){
        document.getElementById('objectDescription').textContent = obj.description;
        descriptionWrapper.style.display = 'block';
    } else {
        descriptionWrapper.style.display = 'none';
    }
}

// Initial update
updateStatusAndDescription();

/* LOAD LEFT COLUMN OBJECTS */
const objectsTableBody = document.getElementById('objectsTableBody');
(objectsTableBody.innerHTML = ''); // clear previous
(streetObjects[streetName] || []).forEach((o, index) => {
    objectsTableBody.insertAdjacentHTML(
        'beforeend',
        `<tr>
            <td>${o.number}</td>
            <td class="object-link" onclick="goToObject('${o.name}')">${o.name}</td>
        </tr>`
    );
});

/* EDIT POPUP */
const editPopup = document.getElementById('editPopup');
const editBtn = document.getElementById('editBtn');
const editStreetName = document.getElementById('editStreetName');
const editDistrict = document.getElementById('editDistrict');
const editExisting = document.getElementById('editExisting');
const editDescription = document.getElementById('editDescription');

editBtn.onclick = () => {
    document.getElementById('popupTitle').textContent = 'Edit Object';
    document.getElementById('popupNameLabel').textContent = 'Object Name:';
    document.getElementById('popupNumberLabel').textContent = 'Number:';

    editStreetName.value = obj.name;
    editDistrict.value = obj.number || '';
    editExisting.value = obj.existing || 'Exists';
    editDescription.value = obj.description || '';

    editPopup.style.display = 'flex';
    editPopup.dataset.mode = 'editObject';
};

/* CLOSE POPUP */
function closeEdit(){ 
    editPopup.style.display = 'none'; 
}
document.querySelector('#editPopup button[onclick="closeEdit()"]').onclick = closeEdit;

/* SAVE EDIT OBJECT — updates immediately without reload */
document.getElementById('saveEditStreet').onclick = () => {
    const mode = editPopup.dataset.mode;
    if(mode === 'editObject'){
        const newName = editStreetName.value.trim();
        const newNumber = editDistrict.value.trim();
        const newExisting = editExisting.value;
        const newDescription = editDescription.value.trim();

        // Find object index
        const idx = (streetObjects[streetName] || []).findIndex(o => o.name === objectName);
        if(idx > -1){
            // Update object in-place
            const objToUpdate = streetObjects[streetName][idx];
            objToUpdate.name = newName;
            objToUpdate.number = newNumber;
            objToUpdate.existing = newExisting;
            objToUpdate.description = newDescription;

            // Save updated data
            localStorage.setItem('streetObjects', JSON.stringify(streetObjects));

            // Update in-memory object
            Object.assign(obj, objToUpdate);

            // Update DOM
            document.getElementById('objectTitle').textContent = obj.name;
            document.getElementById('objectNumber').textContent = obj.number || 'N/A';

            updateStatusAndDescription();

            // Update left column table
            const tableRows = document.querySelectorAll('#objectsTableBody tr');
            tableRows.forEach(row => {
                const cell = row.cells[1];
                if(cell.textContent === objectName){
                    cell.textContent = newName;
                }
            });

            // Update objectName and URL so future edits and refresh work
            objectName = newName;
            const newUrl = `${location.pathname}?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(newName)}`;
            window.history.replaceState(null, '', newUrl);

            // Close popup
            closeEdit();
        }
    }
};

/* GO TO OBJECT */
function goToObject(name){
    window.location.href = `object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(name)}`;
}
</script>

</body>
</html>
