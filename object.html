<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Info</title>
<style>
body { font-family: Arial; background:#121212; color:#eee; margin:0; }

header { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:#1f1f1f; }
header h1 { margin:0; font-size:24px; }
.header-link { color:#fff; text-decoration:none; }
.header-link:hover { text-decoration:underline; }

.main-content { margin:20px; }
h1 { margin-top:0; }

.action-button { cursor:pointer; background:#333; color:#eee; border:1px solid #555; border-radius:5px; padding:6px 12px; font-size:14px; }
.action-button:hover { background:#444; }

.info-line { margin:5px 0; font-size:14px; color:#aaa; }

.rules { margin-top:15px; padding:10px; background:#1f1f1f; border-radius:8px; border:1px solid #444; }
</style>
</head>
<body>

<header>
    <h1><a href="index.html" class="header-link">Historical Interactive Map of Barnsley</a></h1>
</header>

<div class="main-content">
    <h1 id="objectTitle"></h1>
    <div class="info-line"><strong>Street:</strong> <span id="objectStreet"></span></div>
    <div class="info-line"><strong>Number:</strong> <span id="objectNumber"></span></div>
    <div class="info-line"><strong>Existing:</strong> <span id="objectExisting"></span></div>

    <div class="rules" id="objectDescription"></div>

    <div style="margin-top:20px;">
        <button onclick="window.history.back()" class="action-button">Back</button>
    </div>
</div>

<script>
const qp = p => new URLSearchParams(location.search).get(p);
const streetName = qp('street');
const objectName = qp('object');

/* LOAD DATA */
let streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
let streetsData = JSON.parse(localStorage.getItem('streetsData')) || {};

/* FIND OBJECT */
const obj = (streetObjects[streetName] || []).find(o => o.name === objectName);
if(!obj){
    document.getElementById('objectTitle').textContent = 'Object not found';
    throw new Error('Object missing');
}

/* DISPLAY INFO */
document.getElementById('objectTitle').textContent = obj.name;
document.getElementById('objectStreet').textContent = streetName;
document.getElementById('objectNumber').textContent = obj.number || 'N/A';
document.getElementById('objectExisting').textContent = obj.existing ? 'Yes' : 'No';
document.getElementById('objectDescription').textContent = obj.description || 'No description available';

/* Optional: highlight street link */
document.getElementById('objectStreet').style.cursor = 'pointer';
document.getElementById('objectStreet').style.textDecoration = 'underline';
document.getElementById('objectStreet').onclick = () => {
    window.location.href = `street.html?name=${encodeURIComponent(streetName)}`;
};
</script>

</body>
</html>
