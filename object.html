<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Info</title>
<style>
body { font-family: Arial; background:#121212; color:#eee; margin:0; }
header { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:#1f1f1f; }
header h1 { margin:0; font-size:24px; }
.header-link { color:#fff; text-decoration:none; }
.header-link:hover { text-decoration:underline; }

.left-column { width:200px; position:fixed; top:40px; left:0; bottom:0; padding:10px; border-right:1px solid #333; overflow-y:auto; }
.objects-table { width:100%; border-collapse:collapse; }
.objects-table th, .objects-table td { padding:6px 8px; border-bottom:1px solid #555; text-align:left; }
.objects-table th { background:#1f1f1f; }
.object-link { cursor:pointer; text-decoration:none; color:inherit; }
.object-link:hover { text-decoration:underline; }

.main-content { margin-left:230px; padding:20px; }
h1 { margin-top:0; }
#objectStreetLine { font-size:22px; } 
.info-line { margin:5px 0; }
.action-button { cursor:pointer; background:#333; color:#eee; border:1px solid #555; border-radius:5px; padding:6px 12px; font-size:14px; }
.action-button:hover { background:#444; }

.popup-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:1000; }
.popup { background:#1f1f1f; padding:25px; border-radius:10px; width:400px; max-width:90%; border:1px solid #444; }
.popup h3 { text-align:center; margin-top:0; }
.popup label { display:block; margin-top:10px; }
.popup input[type="text"], .popup textarea, .popup select, .popup input[type="date"] { width:100%; padding:5px; margin-top:5px; background:#2b2b2b; color:#eee; border:1px solid #555; border-radius:5px; }
.popup input[type="checkbox"] { margin-left:6px; transform:scale(1.1); }
.popup-buttons { margin-top:20px; display:flex; justify-content:space-between; }

#gradeOptions { display:none; margin-top:10px; }

#photosContainer { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
.photo-box { width:120px; border:1px solid #555; padding:5px; background:#1f1f1f; text-align:center; font-size:12px; border-radius:5px; }
.photo-box img { width:100%; height:auto; display:block; margin-bottom:5px; border-radius:3px; }

</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body>

<header>
    <h1><a href="index.html" class="header-link">Historical Interactive Map of Barnsley</a></h1>
</header>

<div class="left-column">
    <h2>Objects on this street</h2>
    <table class="objects-table">
        <thead><tr><th>No.</th><th>Name</th></tr></thead>
        <tbody id="objectsTableBody"></tbody>
    </table>
</div>

<div class="main-content">
    <h1 id="objectTitle"></h1>
    <p class="info-line" id="objectStreetLine">
        <span id="objectStreet" class="object-link"></span>
        <span id="objectNumber" style="font-weight:bold; margin-left:5px;"></span>
    </p>

    <div id="additionalInfo"></div>
    <p id="descriptionWrapper"><strong>Description:</strong> <span id="objectDescription"></span></p>

    <div style="margin:15px 0;">
        <button id="addPhotoBtn" class="action-button">Add Photo</button>
        <button id="editBtn" class="action-button">Edit</button>
        <button id="deleteBtn" class="action-button">Delete</button>
    </div>

    <!-- PHOTOS SECTION -->
    <div id="photosSection" style="margin-top:20px;">
        <h3>Photos:</h3>
        <div id="photosContainer"></div>
    </div>
</div>

<!-- ADD PHOTO POPUP -->
<div class="popup-overlay" id="addPhotoPopup">
    <div class="popup" style="width:450px; max-width:95%;">
        <h3 id="addPhotoTitle" style="text-align:center;">Adding photo(s) to:</h3>
        <p id="addPhotoSubTitle" style="text-align:center; font-size:14px; margin-top:0;"></p>

        <label for="photoFile">File:</label>
        <input type="file" id="photoFile" accept="image/*">

        <label for="photoDate">Date:</label>
        <input type="date" id="photoDate">

        <label for="photoDescription">Photo Description:</label>
        <textarea id="photoDescription" rows="3"></textarea>

        <div class="popup-buttons" style="justify-content:center; margin-top:20px;">
            <button id="savePhotoBtn" class="action-button">Add Photo</button>
            <button onclick="closeAddPhoto()" class="action-button">Cancel</button>
        </div>
    </div>
</div>

<script>
const qp = p => new URLSearchParams(location.search).get(p);
const streetName = qp('street');
const objectName = qp('object');

let streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
const obj = (streetObjects[streetName] || []).find(o=>o.name===objectName);
if(!obj){ alert('Object not found'); throw new Error('Object missing'); }

const objectTitle = document.getElementById('objectTitle');
const objectStreet = document.getElementById('objectStreet');
const objectNumber = document.getElementById('objectNumber');
const additionalInfo = document.getElementById('additionalInfo');
const objectDescription = document.getElementById('objectDescription');

const objectsTableBody = document.getElementById('objectsTableBody');
const addPhotoBtn = document.getElementById('addPhotoBtn');
const addPhotoPopup = document.getElementById('addPhotoPopup');
const addPhotoSubTitle = document.getElementById('addPhotoSubTitle');
const photoFile = document.getElementById('photoFile');
const photoDate = document.getElementById('photoDate');
const photoDescription = document.getElementById('photoDescription');
const savePhotoBtn = document.getElementById('savePhotoBtn');
const photosContainer = document.getElementById('photosContainer');

/* Display object info */
objectTitle.textContent = obj.name;
objectStreet.textContent = streetName;
objectStreet.onclick = ()=> window.location.href=`street.html?name=${encodeURIComponent(streetName)}`;
objectNumber.textContent = obj.number || '';
objectDescription.textContent = obj.description || '';
additionalInfo.innerHTML='';

/* LEFT COLUMN */
objectsTableBody.innerHTML='';
(streetObjects[streetName]||[]).forEach((o)=>{
    objectsTableBody.insertAdjacentHTML('beforeend',
        `<tr><td>${o.number||''}</td><td class="object-link" onclick="window.location.href='object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(o.name)}'">${o.name}</td></tr>`
    );
});

/* Add Photo */
addPhotoBtn.onclick = () => {
    addPhotoSubTitle.textContent = `${streetName} ${obj.number || ''}, ${obj.name}`;
    photoFile.value=''; photoDate.value=''; photoDescription.value='';
    addPhotoPopup.style.display='flex';
};
function closeAddPhoto(){ addPhotoPopup.style.display='none'; }

savePhotoBtn.onclick = ()=>{
    const file = photoFile.files[0];
    if(!file) return alert("Select a file!");
    const reader = new FileReader();
    reader.onload = function(e){
        const dataURL = e.target.result;
        if(!obj.photos) obj.photos=[];
        obj.photos.push({ dataURL, date:photoDate.value, description:photoDescription.value });
        const idx = streetObjects[streetName].findIndex(o=>o.name===obj.name);
        if(idx!==-1){ streetObjects[streetName][idx]=obj; localStorage.setItem('streetObjects',JSON.stringify(streetObjects)); }
        closeAddPhoto();
        renderPhotos();
    };
    reader.readAsDataURL(file);
};

/* Render Photos */
function renderPhotos(){
    photosContainer.innerHTML='';
    if(!obj.photos) return;
    const sorted = obj.photos.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
    sorted.forEach(p=>{
        const div = document.createElement('div');
        div.className='photo-box';
        div.innerHTML = `<img src="${p.dataURL}" alt="${p.description||'Photo'}"><div style="color:#aaa;">${p.date||''}</div>`;
        photosContainer.appendChild(div);
    });
}

renderPhotos();
</script>
</body>
</html>
