<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Object Details</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body { font-family: Arial; margin:0; padding:0; background:#f5f5f5; }
header { 
  background:#f0f0f0; 
  color:black; 
  padding:15px; 
  display:flex; 
  justify-content:space-between; 
  align-items:center; 
}
header h1 { margin:0; cursor:pointer; }
header h1:hover { text-decoration: underline; }
header .auth-buttons button { margin-left:10px; padding:6px 12px; cursor:pointer; }

.container {
  margin:20px auto;
  max-width:600px;
  background:white;
  padding:20px;
  border-radius:6px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

h2 { margin-top:0; display:flex; align-items:center; }
h2 img { margin-right:10px; }

button { padding:6px 12px; margin:5px; cursor:pointer; }

.label { font-weight:bold; margin-top:10px; display:block; }
.value { margin-left:10px; }

#photoList img { max-width:300px; display:block; margin:10px 0; }
#createObjectFormContainer { margin-top:20px; }

#objectMapDiv { width:100%; height:400px; border-radius:6px; margin-top:10px; }
.section { margin-top:20px; }
#directory { font-size:0.9em; color:#555; margin-bottom:10px; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <h1 onclick="window.location.href='street.html'">Historical Interactive Map of Barnsley</h1>
  <div class="auth-buttons">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Log In</button>
  </div>
</header>

<!-- OBJECT DETAILS -->
<div class="container" id="objectContainer">
  <h2><img id="categoryIcon" src="" width="40" height="40"> <span id="objectName"></span></h2>
  <div id="directory"></div>

  <!-- ACTION BUTTONS -->
  <button onclick="addPhoto()">Add Photo</button>
  <button onclick="editObject()">Edit</button>
  <button onclick="enableEditMap()">Edit Map</button>
  <button onclick="deleteObject()" style="background:#d9534f;color:white;">Delete</button>

  <!-- Object fields -->
  <div><span class="label">Street Number:</span><span class="value" id="objectNumber"></span></div>
  <div><span class="label">Year Built:</span><span class="value" id="objectYearBuilt"></span></div>
  <div><span class="label">Year Destroyed:</span><span class="value" id="objectYearDestroyed"></span></div>
  <div><span class="label">Description:</span><span class="value" id="objectDescription"></span></div>
  <div><span class="label">Status:</span><span class="value" id="objectStatus"></span></div>
  <div><span class="label">Building Category:</span><span class="value" id="objectCategory"></span></div>

  <!-- Photos -->
  <div class="section">
    <h3>Object Photos</h3>
    <div id="photoList"></div>
  </div>

  <!-- MAP SECTION (ALWAYS SHOWN) -->
  <div class="section">
    <h3>Object Location</h3>
    <div id="objectMapDiv"></div>
    <small>Click on the map to place or adjust the object location.</small>
  </div>

  <!-- EDIT OBJECT FORM (hidden initially) -->
  <div id="createObjectFormContainer" style="display:none;">
    <h3>Edit Object</h3>
    <form id="createObjectForm">
      <label>Street Number (required): <input type="text" name="number" required></label><br><br>
      <label>Name (required): <input type="text" name="name" required></label><br><br>
      <label>Year Built (optional): <input type="text" name="yearBuilt"></label><br><br>
      <label>Year Destroyed (optional): <input type="text" name="yearDestroyed"></label><br><br>
      <label>Description (optional): <textarea name="description" rows="3" cols="30"></textarea></label><br><br>
      <label>Status (required):
        <select name="status" required>
          <option value="">Select status</option>
          <option value="Exists">Exists</option>
          <option value="Doesn't Exist">Doesn't Exist</option>
          <option value="Exists partially">Exists partially</option>
          <option value="For Demolition">For Demolition</option>
          <option value="In construction">In construction</option>
        </select>
      </label><br><br>
      <label>Building Category (required):
        <select name="category" required>
          <option value="">Select category</option>
          <option value="townhouse">Townhouse</option>
          <option value="terraced house">Terraced House</option>
          <option value="house">House</option>
          <option value="semi-detached house">Semi-Detached House</option>
          <option value="building">Building</option>
          <option value="palace/manor">Palace/Manor</option>
          <option value="villa">Villa</option>
          <option value="warehouse/hall">Warehouse/Hall</option>
        </select>
      </label><br><br>
      <button type="submit">Save Changes</button>
      <button type="button" onclick="hideObjectForm()">Cancel</button>
    </form>
  </div>
</div>

<script>
// ---------------- AUTH MOCK ----------------
function signup(){ alert("Sign Up clicked"); }
function login(){ alert("Log In clicked"); }

// ---------------- ICONS FOR BUILDING CATEGORIES ----------------
const categoryIcons = {
  "townhouse": "https://polska-org.pl/gfx/category/500045.png",
  "terraced house": "https://polska-org.pl/gfx/category/500046.png",
  "house": "https://polska-org.pl/gfx/category/500129.png",
  "semi-detached house": "https://polska-org.pl/gfx/category/500046.png",
  "building": "https://polska-org.pl/gfx/category/6216777.png",
  "palace/manor": "https://polska-org.pl/gfx/obj/05h.png",
  "villa": "https://polska-org.pl/gfx/obj/05c.png",
  "warehouse/hall": "https://polska-org.pl/gfx/category/500049.png"
};

// ---------------- GET OBJECT DATA ----------------
let street = localStorage.getItem("currentStreet");
let objects = JSON.parse(localStorage.getItem(street + "_objects")) || [];
let index = localStorage.getItem("currentObjectIndex");
let obj = objects[index];

if(!obj){
  alert("No object selected!");
  window.location.href = "street.html";
}

// ---------------- DISPLAY OBJECT DATA ----------------
function renderObjectData(){
  document.getElementById("objectName").innerText = obj.name; // No [Building]
  document.getElementById("objectNumber").innerText = obj.number || "-";
  document.getElementById("objectYearBuilt").innerText = obj.yearBuilt || "-";
  document.getElementById("objectYearDestroyed").innerText = obj.yearDestroyed || "-";
  document.getElementById("objectDescription").innerText = obj.description || "-";
  document.getElementById("objectStatus").innerText = obj.status || "-";
  document.getElementById("objectCategory").innerText = obj.category || "-";
  document.getElementById("categoryIcon").src = categoryIcons[obj.category] || 'icons/default.png';

  document.getElementById("directory").innerHTML =
    `United Kingdom &gt; England &gt; South Yorkshire &gt; 
     <span style="cursor:pointer; color:#007bff;" onclick="window.location.href='index.html'">Barnsley</span> &gt; 
     <span style="cursor:pointer; color:#007bff;" onclick="window.location.href='street.html'">${street}</span> 
     <b>${obj.number || '-'}</b>`;
}
renderObjectData();

// ---------------- PHOTOS ----------------
let photos = JSON.parse(localStorage.getItem(street + "_object_" + index + "_photos")) || [];
function renderPhotos(){
  let container = document.getElementById("photoList");
  container.innerHTML = "";
  photos.forEach(photo=>{
    let img = document.createElement("img");
    img.src = photo;
    container.appendChild(img);
  });
}
renderPhotos();

function addPhoto(){
  let url = prompt("Paste image URL for this object:");
  if(url){
    photos.push(url);
    localStorage.setItem(street + "_object_" + index + "_photos", JSON.stringify(photos));
    renderPhotos();
  }
}

// ---------------- EDIT OBJECT ----------------
function editObject(){
  document.getElementById("createObjectFormContainer").style.display = "block";
  const form = document.getElementById("createObjectForm");
  form.number.value = obj.number || "";
  form.name.value = obj.name || "";
  form.yearBuilt.value = obj.yearBuilt || "";
  form.yearDestroyed.value = obj.yearDestroyed || "";
  form.description.value = obj.description || "";
  form.status.value = obj.status || "";
  form.category.value = obj.category || "";
}

function hideObjectForm(){
  document.getElementById("createObjectFormContainer").style.display = "none";
}

document.getElementById("createObjectForm").addEventListener("submit", function(e){
  e.preventDefault();
  const form = e.target;
  const number = form.number.value.trim();
  const name = form.name.value.trim();
  const yearBuilt = form.yearBuilt.value.trim();
  const yearDestroyed = form.yearDestroyed.value.trim();
  const description = form.description.value.trim();
  const status = form.status.value;
  const category = form.category.value;

  if(!number || !name || !status || !category){
    alert("Please fill out all required fields!");
    return;
  }

  obj.number = number;
  obj.name = name;
  obj.yearBuilt = yearBuilt;
  obj.yearDestroyed = yearDestroyed;
  obj.description = description;
  obj.status = status;
  obj.category = category;

  objects[index] = obj;
  localStorage.setItem(street + "_objects", JSON.stringify(objects));

  renderObjectData();
  hideObjectForm();
});

// ---------------- DELETE OBJECT ----------------
function deleteObject(){
  if(confirm("Are you sure you want to delete this object?")){
    objects.splice(index,1);
    localStorage.setItem(street + "_objects", JSON.stringify(objects));
    localStorage.removeItem(street + "_object_" + index + "_photos");
    localStorage.removeItem(street + "_object_" + index + "_location");
    alert("Object deleted");
    window.location.href = "street.html";
  }
}

// ---------------- MAP SECTION (ALWAYS SHOWN) ----------------
const savedLocation = JSON.parse(localStorage.getItem(street + "_object_" + index + "_location"));

const map = L.map('objectMapDiv').setView(
  savedLocation ? [savedLocation.lat, savedLocation.lng] : [53.5526, -1.4820], 17
);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let marker;
function createMarker(latlng){
  const icon = L.icon({
    iconUrl: categoryIcons[obj.category] || 'icons/default.png',
    iconSize: [32, 32],
    iconAnchor: [16, 32],
    popupAnchor: [0, -32]
  });
  marker = L.marker([latlng.lat, latlng.lng], {icon: icon, draggable:true}).addTo(map)
           .bindPopup(obj.name)
           .openPopup();
  saveLocation(latlng);
}

// Initial marker
if(savedLocation){
  createMarker(savedLocation);
}

// Place new marker by clicking map if none exists
map.on('click', function(e){
  if(!marker){
    createMarker(e.latlng);
  }
});

// ---------------- EDIT MAP FUNCTION ----------------
function enableEditMap(){
  if(marker){
    marker.dragging.enable();
    alert("Drag the marker to change the object's location. Changes are saved automatically.");
  } else {
    alert("Click on the map to place the object marker first.");
  }
}

// Save location whenever marker is dragged
function saveLocation(latlng){
  localStorage.setItem(street + "_object_" + index + "_location", JSON.stringify({lat:latlng.lat, lng:latlng.lng}));
}

if(marker){
  marker.on('dragend', function(e){
    saveLocation(marker.getLatLng());
    alert("Location updated!");
  });
}
</script>
</body>
</html>
