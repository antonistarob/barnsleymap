<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Info</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: #eee;
    margin: 0;
}

/* --- HEADER --- */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background-color: #1f1f1f;
    color: #eee;
    width: 100%;
    box-sizing: border-box;
    position: relative;
    z-index: 10;
}

header h1 {
    margin: 0;
    font-size: 24px;
    color: #fff;
}

.header-link {
    color: #fff;
    text-decoration: none;
}

.header-link:hover {
    text-decoration: underline;
}

.auth-buttons button {
    margin-left: 10px;
    padding: 5px 10px;
    cursor: pointer;
    background-color: #333;
    color: #eee;
    border: 1px solid #555;
    border-radius: 5px;
}

.auth-buttons button:hover {
    background-color: #444;
}

/* LEFT COLUMN */
.left-column {
    width: 200px;
    position: fixed;
    top: 40px; /* below header */
    left: 0;
    bottom: 0;
    padding: 10px;
    border-right: 1px solid #333;
    overflow-y: auto;
}

.objects-table {
    width: 100%;
    border-collapse: collapse;
}

.objects-table th,
.objects-table td {
    padding: 6px 8px;
    border-bottom: 1px solid #555;
    text-align: left;
}

.objects-table th {
    background-color: #1f1f1f;
}

/* MAIN CONTENT */
.main-content {
    margin-left: 230px;
    margin-top: 0px; /* below header */
    padding: 20px;
}

h1 { margin-top: 0; }

a {
    color: #4a90e2;
    text-decoration: none;
}

a.object-link {
    cursor: pointer;
    text-decoration: none;
}

a.object-link:hover {
    text-decoration: underline;
}

.action-button {
    cursor: pointer;
    background-color: #333;
    color: #eee;
    border: 1px solid #555;
    border-radius: 5px;
    padding: 6px 12px;
    font-size: 14px;
}

.action-button:hover {
    background-color: #444;
}

/* POPUPS */
.popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.popup {
    background: #1f1f1f;
    padding: 25px;
    border-radius: 10px;
    width: 400px;
    max-width: 90%;
    border: 1px solid #444;
}

.popup h3 {
    text-align: center;
    margin-top: 0;
}

.popup label {
    display: block;
    margin-top: 10px;
}

.popup input[type="text"],
.popup textarea,
.popup select {
    width: 100%;
    padding: 5px;
    margin-top: 5px;
    background-color: #2b2b2b;
    color: #eee;
    border: 1px solid #555;
    border-radius: 5px;
}

.popup input[type="checkbox"] {
    margin-left: 6px;
    transform: scale(1.1);
}

.popup-buttons {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <h1>
        <a href="index.html" class="header-link">
            Historical Interactive Map of Barnsley
        </a>
    </h1>
    <div class="auth-buttons">
        <button>Sign Up</button>
        <button>Log In</button>
    </div>
</header>

<!-- LEFT COLUMN -->
<div class="left-column">
    <h2>Objects on this street</h2>
    <table class="objects-table">
        <thead>
            <tr><th>No.</th><th>Name</th></tr>
        </thead>
        <tbody id="objectsTableBody"></tbody>
    </table>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">
    <h1 id="objectTitle"></h1>
    <p id="objectDirectory" style="margin-top:5px; color:#ccc;"></p>
    <p id="descriptionWrapper"><strong>Description:</strong> <span id="objectDescription"></span></p>
</div>

<script>
const qp = p => new URLSearchParams(location.search).get(p);
const streetName = qp('street');
const objectName = qp('object');

/* ELEMENTS */
const objectsTableBody = document.getElementById('objectsTableBody');
const objectTitle = document.getElementById('objectTitle');
const objectDirectory = document.getElementById('objectDirectory');
const objectDescription = document.getElementById('objectDescription');

/* DATA */
let streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
let streetsData = JSON.parse(localStorage.getItem('streetsData')) || {};

/* Find the object data */
const objectsList = streetObjects[streetName] || [];
const data = objectsList.find(o => o.name === objectName);

if(!data){
    objectTitle.textContent = 'Object not found';
    throw new Error('Object missing');
}

/* DISPLAY */
objectTitle.textContent = data.name;
objectDescription.textContent = data.description || 'N/A';

/* Directory line: "Street Name **Number**" */
objectDirectory.innerHTML = `${streetName} <strong>${data.number || ''}</strong>`;

/* LOAD OBJECTS IN LEFT COLUMN */
objectsList.forEach(o => {
    objectsTableBody.insertAdjacentHTML(
        'beforeend',
        `<tr>
            <td>${o.number}</td>
            <td>
                <a class="object-link" onclick="goToObject('${o.name}')">${o.name}</a>
            </td>
        </tr>`
    );
});

/* Function to navigate to object page */
function goToObject(name){
    const streetParam = encodeURIComponent(streetName);
    const objectParam = encodeURIComponent(name);
    window.location.href = `object.html?street=${streetParam}&object=${objectParam}`;
}
</script>

</body>
</html>
