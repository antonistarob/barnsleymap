<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Create Object</title>
<style>
body {
  font-family: Arial, sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:0;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.popup {
  background:white;
  padding:20px;
  width:400px;
  border-radius:6px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.popup h2 {
  text-align:center;
  margin-top:0;
  margin-bottom:20px;
  font-weight:bold;
}

label {
  font-weight:bold;
  display:block;
  margin-top:10px;
}

input, textarea, select {
  width:100%;
  padding:6px;
  margin-top:4px;
  box-sizing:border-box;
}

textarea { resize:vertical; }

.buttons {
  text-align:center;
  margin-top:20px;
}

button { padding:6px 14px; margin:0 5px; cursor:pointer; }
.cancel { background:#ccc; }
</style>
</head>
<body>

<div class="popup">
  <h2>Create Object</h2>

  <label>Street Number:</label>
  <input type="text" id="number">

  <label>Object Name:</label>
  <input type="text" id="name">

  <label>Year Built:</label>
  <input type="text" id="yearBuilt">

  <label>Year Destroyed:</label>
  <input type="text" id="yearDestroyed">

  <label>Description:</label>
  <textarea id="description" rows="3"></textarea>

  <label>Status:</label>
  <select id="status">
    <option value="">Select</option>
    <option>Exists</option>
    <option>Doesn't Exist</option>
    <option>Exists partially</option>
    <option>For Demolition</option>
    <option>In construction</option>
  </select>

  <label>Category:</label>
  <select id="category">
    <option value="">Select</option>
    <option value="townhouse">Townhouse</option>
    <option value="terraced house">Terraced House</option>
    <option value="house">House</option>
    <option value="semi-detached house">Semi-Detached House</option>
    <option value="building">Building</option>
    <option value="palace/manor">Palace/Manor</option>
    <option value="villa">Villa</option>
    <option value="warehouse/hall">Warehouse/Hall</option>
  </select>

  <div class="buttons">
    <button onclick="saveObject()">Save</button>
    <button class="cancel" onclick="window.close()">Cancel</button>
  </div>
</div>

<script>
const street = localStorage.getItem("currentStreet");
if(!street){ alert("No street selected"); window.close(); }

function saveObject(){
  // get form values...
  const number = document.getElementById("number").value.trim();
  const name = document.getElementById("name").value.trim();
  const yearBuilt = document.getElementById("yearBuilt").value.trim();
  const yearDestroyed = document.getElementById("yearDestroyed").value.trim();
  const description = document.getElementById("description").value.trim();
  const status = document.getElementById("status").value;
  const category = document.getElementById("category").value;

  if(!number || !name || !status || !category){
    alert("Please fill in all required fields.");
    return;
  }

  const id = Date.now() + Math.floor(Math.random()*1000);
  const obj = { id, street, number, name, yearBuilt, yearDestroyed, description, status, category };
  localStorage.setItem("object_" + id, JSON.stringify(obj));

  // add ID to street
  const idsKey = street + "_objectIDs";
  let ids = JSON.parse(localStorage.getItem(idsKey)) || [];
  ids.push(id);
  localStorage.setItem(idsKey, JSON.stringify(ids));

  // ✅ Set currentObjectID so object.html loads the new object
  localStorage.setItem("currentObjectID", id);

  // refresh parent street page if open
  if(window.opener && !window.opener.closed){
    if(typeof window.opener.renderObjects === "function") window.opener.renderObjects();
    if(typeof window.opener.renderStreetMarkers === "function") window.opener.renderStreetMarkers();
  }

  window.close();
}

// Optional: Enter = Save, Escape = Cancel
document.addEventListener("keydown", function(e){
  if(e.key === "Enter") saveObject();
  if(e.key === "Escape") window.close();
});
</script>
</body>
</html>
