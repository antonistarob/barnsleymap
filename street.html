<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Street</title>
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { font-family: Arial; margin:0; padding:0; display:flex; background:#f5f5f5; }

/* Left sidebar */
#sidebar {
  width: 250px;
  background:white;
  padding:15px;
  box-shadow:2px 0 5px rgba(0,0,0,0.1);
  overflow-y:auto;
  height:100vh;
}

/* Main content */
#mainContent {
  flex-grow:1;
  padding:20px;
}

/* Action buttons */
button { padding:6px 12px; margin:5px; cursor:pointer; }

/* Photos and sections */
img { max-width:300px; display:block; margin:10px 0; }
.section { margin-top:30px; background:white; padding:15px; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
h2,h3,h4 { margin:10px 0; }
ul { list-style:none; padding:0; }

/* Sidebar object styling */
.object-item {
  display: flex;
  align-items: center;
  margin:6px 0;
  padding:4px;
  border-radius:4px;
}
.object-number {
  background:#007bff;
  color:white;
  font-weight:bold;
  padding:4px 8px;
  border-radius:4px;
  margin-right:10px;
  min-width:40px;
  text-align:center;
  flex-shrink:0;
}
.object-info span {
  font-weight:bold;
  margin-right:5px;
}

/* Leaflet map */
#streetMapDiv {
  width: 100%;
  height: 300px;
  border-radius:6px;
  margin-top:10px;
}
</style>
</head>

<body>

<!-- LEFT SIDEBAR -->
<div id="sidebar">
  <h3>Objects (sorted)</h3>
  <ul id="sidebarList"></ul>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent">

<h2 id="streetName"></h2>

<!-- STREET ACTION BUTTONS -->
<button onclick="editStreet()">Edit</button>
<button onclick="addPhoto()">Add Photo</button>
<button onclick="openMap()">Map</button>
<button onclick="createObject()">Create Object</button>
<button onclick="deleteStreet()" style="background:#d9534f;color:white;">Delete</button>

<!-- STREET PHOTOS -->
<div class="section">
  <h3>Street Photos (Panoramas)</h3>
  <div id="photoList"></div>
</div>

<!-- STREET LOCATION MAP -->
<div class="section">
  <h3>Street Location</h3>
  <div id="streetMapDiv"></div>
  <p id="coordsDisplay"></p>
</div>

</div> <!-- End mainContent -->

<script>
// ---------------- GET CURRENT STREET ----------------
let street = localStorage.getItem("currentStreet");
if(!street){
  alert("No street selected!");
  window.location.href = "index.html";
}

// ---------------- LOAD DATA ----------------
let streets = JSON.parse(localStorage.getItem("streets")) || [];
let objects = JSON.parse(localStorage.getItem(street + "_objects")) || [];
let photos = JSON.parse(localStorage.getItem(street + "_photos")) || [];

// ---------------- DISPLAY STREET NAME ----------------
document.getElementById("streetName").innerText = street;

// ---------------- RENDER OBJECTS ----------------
function renderObjects(){
  let sidebar = document.getElementById("sidebarList");

  // Sort objects by number
  objects.sort((a,b)=>Number(a.number) - Number(b.number));

  sidebar.innerHTML = "";
  objects.forEach(obj=>{
    let li = document.createElement("li");
    li.classList.add("object-item");

    li.innerHTML = `
      <div class="object-number">#${obj.number}</div>
      <div class="object-info">
        [${obj.type}] ${obj.name}
      </div>
    `;

    sidebar.appendChild(li);
  });
}

// ---------------- RENDER PHOTOS ----------------
function renderPhotos(){
  let container = document.getElementById("photoList");
  container.innerHTML = "";
  photos.forEach(photo=>{
    let img = document.createElement("img");
    img.src = photo;
    container.appendChild(img);
  });
}

// ---------------- EDIT STREET ----------------
function editStreet(){
  let newName = prompt("Enter new street name:", street);
  if(newName && newName !== street){

    // Update streets list
    let index = streets.indexOf(street);
    streets[index] = newName;
    localStorage.setItem("streets", JSON.stringify(streets));

    // Move stored data
    localStorage.setItem(newName + "_objects", JSON.stringify(objects));
    localStorage.setItem(newName + "_photos", JSON.stringify(photos));
    let location = localStorage.getItem(street + "_location");
    if(location) localStorage.setItem(newName + "_location", location);

    localStorage.removeItem(street + "_objects");
    localStorage.removeItem(street + "_photos");
    localStorage.removeItem(street + "_location");

    localStorage.setItem("currentStreet", newName);

    alert("Street renamed!");
    location.reload();
  }
}

// ---------------- DELETE STREET ----------------
function deleteStreet(){
  if(confirm("Are you sure you want to delete this street?")){
    streets = streets.filter(s => s !== street);
    localStorage.setItem("streets", JSON.stringify(streets));

    localStorage.removeItem(street + "_objects");
    localStorage.removeItem(street + "_photos");
    localStorage.removeItem(street + "_location");

    alert("Street deleted.");
    window.location.href = "index.html";
  }
}

// ---------------- ADD PHOTO ----------------
function addPhoto(){
  let url = prompt("Paste image URL of whole street panorama:");
  if(url){
    photos.push(url);
    localStorage.setItem(street + "_photos", JSON.stringify(photos));
    renderPhotos();
  }
}

// ---------------- MAP LOCATION ----------------
function openMap(){
  window.location.href = "street-map.html";
}

// ---------------- CREATE OBJECT ----------------
function createObject(){
  let number = prompt("Object Number (e.g. 55)");
  let name = prompt("Object Name (e.g. Building nr 55)");
  let exists = confirm("Does it still exist?");
  let type = prompt("Object Type: Building, Post Office, Church, School");

  if(number && name && type){
    objects.push({number, name, exists, type});
    localStorage.setItem(street + "_objects", JSON.stringify(objects));
    renderObjects();
  }
}

// ---------------- RENDER STREET LOCATION MAP (LEAFLET) ----------------
function renderStreetMap(){
  const location = JSON.parse(localStorage.getItem(street + "_location"));
  const coordsDisplay = document.getElementById("coordsDisplay");

  if(location){
    coordsDisplay.innerText = `Latitude: ${location.lat.toFixed(6)}, Longitude: ${location.lng.toFixed(6)}`;

    // Create Leaflet map
    const map = L.map('streetMapDiv').setView([location.lat, location.lng], 16);

    // OSM tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Marker
    L.marker([location.lat, location.lng]).addTo(map)
      .bindPopup(street)
      .openPopup();

  } else {
    coordsDisplay.innerText = "No location set for this street yet.";
  }
}

// ---------------- INITIAL RENDER ----------------
renderObjects();
renderPhotos();
renderStreetMap();
</script>

</body>
</html>
