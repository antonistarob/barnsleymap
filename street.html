<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Street</title>
<style>
body { font-family: Arial; padding:20px; background:#f5f5f5; }
button { padding:6px 12px; margin:5px; cursor:pointer; }
img { max-width:300px; display:block; margin:10px 0; }
.section { margin-top:30px; background:white; padding:15px; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
h2,h3,h4 { margin:10px 0; }
ul { list-style:none; padding:0; }
</style>
</head>

<body>

<h2 id="streetName"></h2>

<!-- STREET ACTION BUTTONS -->
<button onclick="editStreet()">Edit</button>
<button onclick="addPhoto()">Add Photo</button>
<button onclick="openMap()">Map</button>
<button onclick="createObject()">Create Object</button>
<button onclick="deleteStreet()" style="background:#d9534f;color:white;">Delete</button>

<!-- STREET PHOTOS -->
<div class="section">
  <h3>Street Photos (Panoramas)</h3>
  <div id="photoList"></div>
</div>

<!-- OBJECTS -->
<div class="section">
  <h3>Objects on this Street</h3>
  <ul id="objectList"></ul>
</div>

<script>
// ---------------- GET CURRENT STREET ----------------
let street = localStorage.getItem("currentStreet");
if(!street){
  alert("No street selected!");
  window.location.href = "index.html";
}

// ---------------- LOAD DATA ----------------
let streets = JSON.parse(localStorage.getItem("streets")) || [];
let objects = JSON.parse(localStorage.getItem(street + "_objects")) || [];
let photos = JSON.parse(localStorage.getItem(street + "_photos")) || [];

// ---------------- DISPLAY STREET NAME ----------------
document.getElementById("streetName").innerText = street;

// ---------------- RENDER OBJECTS ----------------
function renderObjects(){
  let list = document.getElementById("objectList");
  list.innerHTML = "";
  objects.forEach(obj=>{
    let li = document.createElement("li");
    li.innerText = obj.number + " - " + obj.name +
      " (" + obj.type + ")" +
      (obj.exists ? "" : " [No longer exists]");
    list.appendChild(li);
  });
}

// ---------------- RENDER PHOTOS ----------------
function renderPhotos(){
  let container = document.getElementById("photoList");
  container.innerHTML = "";
  photos.forEach(photo=>{
    let img = document.createElement("img");
    img.src = photo;
    container.appendChild(img);
  });
}

// ---------------- EDIT STREET ----------------
function editStreet(){
  let newName = prompt("Enter new street name:", street);
  if(newName && newName !== street){

    // Update streets list
    let index = streets.indexOf(street);
    streets[index] = newName;
    localStorage.setItem("streets", JSON.stringify(streets));

    // Move stored data
    localStorage.setItem(newName + "_objects", JSON.stringify(objects));
    localStorage.setItem(newName + "_photos", JSON.stringify(photos));
    let location = localStorage.getItem(street + "_location");
    if(location) localStorage.setItem(newName + "_location", location);

    localStorage.removeItem(street + "_objects");
    localStorage.removeItem(street + "_photos");
    localStorage.removeItem(street + "_location");

    localStorage.setItem("currentStreet", newName);

    alert("Street renamed!");
    location.reload();
  }
}

// ---------------- DELETE STREET ----------------
function deleteStreet(){
  if(confirm("Are you sure you want to delete this street?")){
    streets = streets.filter(s => s !== street);
    localStorage.setItem("streets", JSON.stringify(streets));

    localStorage.removeItem(street + "_objects");
    localStorage.removeItem(street + "_photos");
    localStorage.removeItem(street + "_location");

    alert("Street deleted.");
    window.location.href = "index.html";
  }
}

// ---------------- ADD PHOTO ----------------
function addPhoto(){
  let url = prompt("Paste image URL of whole street panorama:");
  if(url){
    photos.push(url);
    localStorage.setItem(street + "_photos", JSON.stringify(photos));
    renderPhotos();
  }
}

// ---------------- MAP LOCATION ----------------
function openMap(){
  window.location.href = "street-map.html";
}

// ---------------- CREATE OBJECT ----------------
function createObject(){
  let number = prompt("Object Number (e.g. 55)");
  let name = prompt("Object Name (e.g. Building nr 55)");
  let exists = confirm("Does it still exist?");
  let type = prompt("Object Type: Building, Post Office, Church, School");

  if(number && name && type){
    objects.push({number, name, exists, type});
    localStorage.setItem(street + "_objects", JSON.stringify(objects));
    renderObjects();
  }
}

// ---------------- INITIAL RENDER ----------------
renderObjects();
renderPhotos();

</script>

</body>
</html>
