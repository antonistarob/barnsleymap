<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Info</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: #eee;
    margin: 0;
}

/* LEFT COLUMN */
.left-column {
    width: 200px;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    padding: 10px;
    border-right: 1px solid #333;
    overflow-y: auto;
}

.objects-table {
    width: 100%;
    border-collapse: collapse;
}

.objects-table th,
.objects-table td {
    padding: 5px 10px;
    border-bottom: 1px solid #555;
}

.objects-table th {
    background-color: #1f1f1f;
}

/* MAIN CONTENT */
.main-content {
    margin-left: 220px;
    padding: 20px;
}

h1 { margin-top: 0; }

a {
    color: #4a90e2;
    text-decoration: none;
}

.action-button {
    cursor: pointer;
    background-color: #333;
    color: #eee;
    border: 1px solid #555;
    border-radius: 5px;
    padding: 6px 12px;
    font-size: 14px;
}

.action-button:hover {
    background-color: #444;
}

/* POPUPS */
.popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;                 /* ONLY none here */
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.popup {
    background: #1f1f1f;
    padding: 25px;
    border-radius: 10px;
    width: 400px;
    border: 1px solid #444;
}

.popup label {
    display: block;
    margin-top: 10px;
}

.popup input,
.popup textarea {
    width: 100%;
    padding: 5px;
    margin-top: 5px;
    background: #2b2b2b;
    color: #eee;
    border: 1px solid #555;
    border-radius: 5px;
}

/* BUTTON ROW */
.popup-buttons {
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}
</style>
</head>

<body>

<!-- LEFT COLUMN -->
<div class="left-column">
    <h2>Objects on this street</h2>
    <table class="objects-table">
        <thead>
            <tr><th>No.</th><th>Name</th></tr>
        </thead>
        <tbody id="objectsTableBody"></tbody>
    </table>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">
    <a href="index.html">Back to Map</a>
    <h1 id="streetTitle"></h1>

    <p><strong>District:</strong> <span id="streetDistrict"></span></p>
    <p id="existingWrapper"><strong>Existing:</strong> <span id="streetExisting"></span></p>
    <p id="descriptionWrapper"><strong>Description:</strong> <span id="streetDescription"></span></p>

    <div style="margin:15px 0;">
        <button id="addObjectBtn" class="action-button">Add Object</button>
        <button id="editBtn" class="action-button">Edit</button>
        <button id="deleteStreet" class="action-button">Delete</button>
    </div>
</div>

<!-- EDIT POPUP -->
<div class="popup-overlay" id="editPopup">
    <div class="popup">
        <h3>Edit Street</h3>
        <label>Street Name <input id="editStreetName"></label>
        <label>District <input id="editDistrict"></label>
        <label><input type="checkbox" id="editExisting"> Existing</label>
        <label>Description <textarea id="editDescription"></textarea></label>

        <div class="popup-buttons">
            <button onclick="closeEdit()" class="action-button">Cancel</button>
            <button id="saveEditStreet" class="action-button">Save</button>
        </div>
    </div>
</div>

<!-- DELETE POPUP -->
<div class="popup-overlay" id="deletePopup">
    <div class="popup">
        <p id="deleteMessage"></p>

        <div class="popup-buttons">
            <button onclick="closeDelete()" class="action-button">Cancel</button>
            <button id="confirmDelete" class="action-button">Yes</button>
        </div>
    </div>
</div>

<script>
const qp = p => new URLSearchParams(location.search).get(p);
const streetName = qp('name');

/* ELEMENTS */
const streetTitle = document.getElementById('streetTitle');
const streetDistrict = document.getElementById('streetDistrict');
const streetExisting = document.getElementById('streetExisting');
const existingWrapper = document.getElementById('existingWrapper');
const streetDescription = document.getElementById('streetDescription');
const descriptionWrapper = document.getElementById('descriptionWrapper');
const objectsTableBody = document.getElementById('objectsTableBody');

/* BUTTONS */
const addObjectBtn = document.getElementById('addObjectBtn');
const editBtn = document.getElementById('editBtn');
const deleteStreet = document.getElementById('deleteStreet');
const saveEditStreet = document.getElementById('saveEditStreet');
const confirmDelete = document.getElementById('confirmDelete');

/* POPUPS */
const editPopup = document.getElementById('editPopup');
const deletePopup = document.getElementById('deletePopup');
const deleteMessage = document.getElementById('deleteMessage');

/* EDIT FIELDS */
const editStreetName = document.getElementById('editStreetName');
const editDistrict = document.getElementById('editDistrict');
const editExisting = document.getElementById('editExisting');
const editDescription = document.getElementById('editDescription');

/* DATA */
const streetsData = JSON.parse(localStorage.getItem('streetsData')) || {};
const streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
const data = streetsData[streetName];

if(!data){
    streetTitle.textContent = 'Street not found';
    throw new Error('Street missing');
}

/* DISPLAY DATA */
streetTitle.textContent = streetName;
streetDistrict.textContent = data.district || 'N/A';

if(data.existing === false){
    streetExisting.textContent = 'No';
} else {
    existingWrapper.style.display = 'none';
}

if(data.description){
    streetDescription.textContent = data.description;
} else {
    descriptionWrapper.style.display = 'none';
}

/* LOAD OBJECTS */
(streetObjects[streetName] || []).forEach(o=>{
    objectsTableBody.insertAdjacentHTML(
        'beforeend',
        `<tr><td>${o.number}</td><td>${o.name}</td></tr>`
    );
});

/* ADD OBJECT */
addObjectBtn.addEventListener('click', () => {
    const number = prompt('Street Number');
    const name = prompt('Building Name');
    if(!number || !name) return;

    streetObjects[streetName] ||= [];
    streetObjects[streetName].push({ number, name });
    localStorage.setItem('streetObjects', JSON.stringify(streetObjects));
    location.reload();
});

/* EDIT STREET */
editBtn.addEventListener('click', () => {
    editStreetName.value = streetName;
    editDistrict.value = data.district || '';
    editExisting.checked = data.existing !== false;
    editDescription.value = data.description || '';
    editPopup.style.display = 'flex';
});

saveEditStreet.addEventListener('click', () => {
    streetsData[streetName] = {
        district: editDistrict.value,
        existing: editExisting.checked,
        description: editDescription.value
    };
    localStorage.setItem('streetsData', JSON.stringify(streetsData));
    location.reload();
});

/* DELETE STREET */
deleteStreet.addEventListener('click', () => {
    deleteMessage.innerHTML = `Delete <b>${streetName}</b>?`;
    deletePopup.style.display = 'flex';
});

confirmDelete.addEventListener('click', () => {
    delete streetsData[streetName];
    localStorage.setItem('streetsData', JSON.stringify(streetsData));
    location.href = 'index.html';
});

/* CLOSE FUNCTIONS */
function closeEdit(){ editPopup.style.display = 'none'; }
function closeDelete(){ deletePopup.style.display = 'none'; }
</script>


</body>
</html>
