<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Info</title>
<style>
body { font-family: Arial; background:#121212; color:#eee; margin:0; }
/* HEADER */
header { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; background:#1f1f1f; }
header h1 { margin:0; font-size:24px; }
.header-link { color:#fff; text-decoration:none; }
.header-link:hover { text-decoration:underline; }
.auth-buttons button { margin-left:10px; padding:5px 10px; cursor:pointer; background:#333; color:#eee; border:1px solid #555; border-radius:5px; }
.auth-buttons button:hover { background:#444; }
/* LEFT COLUMN */
.left-column { width:200px; position:fixed; top:40px; left:0; bottom:0; padding:10px; border-right:1px solid #333; overflow-y:auto; }
.objects-table { width:100%; border-collapse:collapse; }
.objects-table th, .objects-table td { padding:6px 8px; border-bottom:1px solid #555; text-align:left; }
.objects-table th { background:#1f1f1f; }
/* MAIN CONTENT */
.main-content { margin-left:230px; padding:20px; }
h1 { margin-top:0; }
.object-link { cursor:pointer; text-decoration:none; color:inherit; }
.object-link:hover { text-decoration:underline; }
.action-button { cursor:pointer; background:#333; color:#eee; border:1px solid #555; border-radius:5px; padding:6px 12px; font-size:14px; }
.action-button:hover { background:#444; }
/* POPUPS */
.popup-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:1000; }
.popup { background:#1f1f1f; padding:25px; border-radius:10px; width:400px; max-width:90%; border:1px solid #444; }
.popup h3 { text-align:center; margin-top:0; }
.popup label { display:block; margin-top:10px; }
.popup input[type="text"], .popup textarea, .popup select { width:100%; padding:5px; margin-top:5px; background:#2b2b2b; color:#eee; border:1px solid #555; border-radius:5px; }
.popup input[type="checkbox"] { margin-left:6px; transform:scale(1.1); }
.popup-buttons { margin-top:20px; display:flex; justify-content:space-between; }
/* GRADE LISTED HIDDEN */
#gradeOptions { display:none; margin-top:10px; }
</style>

<!-- Flatpickr Dark Calendar -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

</head>
<body>

<header>
    <h1><a href="index.html" class="header-link">Historical Interactive Map of Barnsley</a></h1>
    <div class="auth-buttons"><button>Sign Up</button><button>Log In</button></div>
</header>

<div class="left-column">
    <h2 id="objectsHeader">Objects on this street</h2>
    <table class="objects-table">
        <thead><tr><th>No.</th><th>Name</th></tr></thead>
        <tbody id="objectsTableBody"></tbody>
    </table>
</div>

<div class="main-content">
    <h1 id="streetTitle"></h1>
    <p><strong>District:</strong> <span id="streetDistrict"></span></p>
    <p id="existingWrapper"><strong>Existing:</strong> <span id="streetExisting"></span></p>
    <p id="descriptionWrapper"><strong>Description:</strong> <span id="streetDescription"></span></p>
    <div style="margin:15px 0;">
        <button id="addObjectBtn" class="action-button">Add Object</button>
        <button id="editBtn" class="action-button">Edit</button>
        <button id="deleteBtn" class="action-button">Delete</button>
    </div>
</div>

<!-- ADD / EDIT STREET / OBJECT POPUP -->
<div class="popup-overlay" id="editPopup">
    <div class="popup">
        <h3 id="popupTitle">Edit Street</h3>

        <label id="popupNameLabel">Street Name:</label>
        <input type="text" id="editStreetName">

        <label id="popupNumberLabel">District:</label>
        <input type="text" id="editDistrict">

        <label>Year Built:</label>
        <input type="text" id="editYearBuilt" placeholder="e.g. 1890">

        <label>Year Demolished:</label>
        <input type="text" id="editYearDemolished" placeholder="e.g. 1975">

        <label>Status:</label>
        <select id="editExisting">
            <option value="Exists" selected>Exists</option>
            <option value="Doesn't exist">Doesn't exist</option>
            <option value="To be demolished">To be demolished</option>
            <option value="Exists partially">Exists partially</option>
            <option value="In construction">In construction</option>
        </select>

        <label>Grade Listed:</label>
        <input type="checkbox" id="editGradeListed">
        <div id="gradeOptions">
            <label>Grade:</label>
            <select id="editGrade">
                <option value="Grade I">Grade I</option>
                <option value="Grade II*">Grade II*</option>
                <option value="Grade II">Grade II</option>
            </select>
            <label>List Entry Number:</label>
            <input type="text" id="editListEntryNumber">
            <label>Date first listed:</label>
            <input type="text" id="editDateListed">
        </div>

        <label>Description:</label>
        <textarea id="editDescription" rows="3"></textarea>

        <div class="popup-buttons">
            <button id="saveEditStreet" class="action-button">Save</button>
            <button onclick="closeEdit()" class="action-button">Cancel</button>
        </div>
    </div>
</div>

<div class="popup-overlay" id="deletePopup">
    <div class="popup">
        <p id="deleteMessage"></p>
        <div class="popup-buttons">
            <button id="confirmDelete" class="action-button" style="background: #c0392b; border-color: #922b21;">Yes</button>
            <button id="cancelDelete" class="action-button">No</button>
        </div>
    </div>
</div>

<script>
const qp = p => new URLSearchParams(location.search).get(p);
let streetName = qp('name'); // make streetName let so we can rename

/* ELEMENTS */
const streetTitle = document.getElementById('streetTitle');
const streetDistrict = document.getElementById('streetDistrict');
const streetExisting = document.getElementById('streetExisting');
const existingWrapper = document.getElementById('existingWrapper');
const streetDescription = document.getElementById('streetDescription');
const descriptionWrapper = document.getElementById('descriptionWrapper');
const objectsTableBody = document.getElementById('objectsTableBody');
const addObjectBtn = document.getElementById('addObjectBtn');
const editBtn = document.getElementById('editBtn');
const deleteBtn = document.getElementById('deleteBtn');

const editPopup = document.getElementById('editPopup');
const deletePopup = document.getElementById('deletePopup');
const deleteMessage = document.getElementById('deleteMessage');

const editStreetName = document.getElementById('editStreetName');
const editDistrict = document.getElementById('editDistrict');
const editExisting = document.getElementById('editExisting');
const editDescription = document.getElementById('editDescription');
const editYearBuilt = document.getElementById('editYearBuilt');
const editYearDemolished = document.getElementById('editYearDemolished');
const editGradeListed = document.getElementById('editGradeListed');
const gradeOptions = document.getElementById('gradeOptions');
const editGrade = document.getElementById('editGrade');
const editListEntryNumber = document.getElementById('editListEntryNumber');
const editDateListed = document.getElementById('editDateListed');
const popupTitle = document.getElementById('popupTitle');
const popupNameLabel = document.getElementById('popupNameLabel');
const popupNumberLabel = document.getElementById('popupNumberLabel');

/* LOAD DATA */
let streetsData = JSON.parse(localStorage.getItem('streetsData')) || {};
let streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
let streets = JSON.parse(localStorage.getItem('streets')) || [];

if(!streetsData[streetName]){
    streetTitle.textContent = 'Street not found';
    throw new Error('Street missing');
}

document.getElementById('objectsHeader').textContent = `Objects in ${streetName}`;
const data = streetsData[streetName];

/* DISPLAY STREET INFO */
streetTitle.textContent = streetName;
streetDistrict.textContent = data.district || 'N/A';
if(data.existing === false){
    streetExisting.textContent = 'No';
} else {
    existingWrapper.style.display = 'none';
}
if(data.description){
    streetDescription.textContent = data.description;
} else {
    descriptionWrapper.style.display = 'none';
}

/* LEFT COLUMN */
objectsTableBody.innerHTML = '';
(streetObjects[streetName] || []).forEach(o => {
    const row = document.createElement('tr');
    
    const numberCell = document.createElement('td');
    numberCell.textContent = o.number || '';
    row.appendChild(numberCell);
    
    const nameCell = document.createElement('td');
    nameCell.textContent = o.name;
    nameCell.classList.add('object-link');
    
    // Add click listener safely
    nameCell.addEventListener('click', () => {
        const url = `object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(o.name)}`;
        if (window.location.href === url) {
            window.location.reload(); // force reload if same object
        } else {
            window.location.href = url;
        }
    });
    
    row.appendChild(nameCell);
    objectsTableBody.appendChild(row);
});

function goToObject(name){
    const streetParam = encodeURIComponent(streetName);
    const objectParam = encodeURIComponent(name);
    window.location.href = `object.html?street=${streetParam}&object=${objectParam}`;
}

/* ADD OBJECT POPUP */
addObjectBtn.onclick = () => {
    popupTitle.textContent = 'Add Object';
    popupNameLabel.textContent = 'Object Name:';
    popupNumberLabel.textContent = 'Number:';
    editStreetName.value = '';
    editDistrict.value = '';
    editYearBuilt.value = '';
    editYearDemolished.value = '';
    editExisting.value = 'Exists';
    editGradeListed.checked = false;
    gradeOptions.style.display = 'none';
    editGrade.value = 'Grade I';
    editListEntryNumber.value = '';
    editDateListed.value = '';
    editDescription.value = '';
    editPopup.style.display = 'flex';
    editPopup.dataset.mode = 'addObject';
};

/* GRADE LISTED TOGGLE */
editGradeListed.onchange = () => {
    gradeOptions.style.display = editGradeListed.checked ? 'block' : 'none';
};

/* FLATPICKR CALENDAR */
flatpickr(editDateListed, {
    altInput: true,
    altFormat: "d/m/Y",
    dateFormat: "Y-m-d",
    theme: "dark"
});

/* EDIT STREET */
editBtn.onclick = () => {
    popupTitle.textContent = 'Edit Street';
    popupNameLabel.textContent = 'Street Name:';
    popupNumberLabel.textContent = 'District:';
    editStreetName.value = streetName;
    editDistrict.value = data.district || 'Town Centre';
    editExisting.value = data.existing !== false ? 'Exists' : 'Doesn\'t exist';
    editYearBuilt.value = data.yearBuilt || '';
    editYearDemolished.value = data.yearDemolished || '';
    editGradeListed.checked = data.gradeListed || false;
    gradeOptions.style.display = editGradeListed.checked ? 'block' : 'none';
    editGrade.value = data.grade || 'Grade I';
    editListEntryNumber.value = data.listEntryNumber || '';
    editDateListed.value = data.dateListed || '';
    editDescription.value = data.description || '';
    editPopup.style.display = 'flex';
    editPopup.dataset.mode = 'edit';
};

/* SAVE EDIT / ADD OBJECT */
document.getElementById('saveEditStreet').onclick = () => {
    const mode = editPopup.dataset.mode;
    if(mode === 'edit'){
        const newName = editStreetName.value.trim();
        if(!newName) return alert("Street name cannot be empty.");
        const updatedData = {
            district: editDistrict.value,
            existing: editExisting.value === 'Exists',
            description: editDescription.value,
            yearBuilt: editYearBuilt.value.trim(),
            yearDemolished: editYearDemolished.value.trim(),
            gradeListed: editGradeListed.checked,
            grade: editGrade.value,
            listEntryNumber: editListEntryNumber.value.trim(),
            dateListed: editDateListed.value.trim()
        };
        if(newName !== streetName){
            streetsData[newName] = updatedData;
            delete streetsData[streetName];
            streets = streets.map(s => s === streetName ? newName : s);
            localStorage.setItem('streets', JSON.stringify(streets));
            if(streetObjects[streetName]){
                streetObjects[newName] = streetObjects[streetName];
                delete streetObjects[streetName];
                localStorage.setItem('streetObjects', JSON.stringify(streetObjects));
            }
            streetName = newName;
        } else {
            streetsData[streetName] = updatedData;
        }
        localStorage.setItem('streetsData', JSON.stringify(streetsData));
        location.reload();
    } else if(mode === 'addObject'){
        const objectName = editStreetName.value.trim();
        if(!objectName) return alert("Object name cannot be empty.");
        if(!streetObjects[streetName]) streetObjects[streetName] = [];
        streetObjects[streetName].push({
            name: objectName,
            number: editDistrict.value.trim(),
            status: editExisting.value,
            yearBuilt: editYearBuilt.value.trim(),
            yearDemolished: editYearDemolished.value.trim(),
            gradeListed: editGradeListed.checked,
            grade: editGrade.value,
            listEntryNumber: editListEntryNumber.value.trim(),
            dateListed: editDateListed.value.trim(),
            description: editDescription.value.trim()
        });
        localStorage.setItem('streetObjects', JSON.stringify(streetObjects));
        location.reload();
    }
};

function closeEdit(){ editPopup.style.display = 'none'; }

/* DELETE STREET */
deleteBtn.onclick = () => {
    deleteMessage.innerHTML = `Are you sure you want to delete <b>${streetName}</b>?`;
    deletePopup.style.display = 'flex';
};
document.getElementById('cancelDelete').onclick = () => { deletePopup.style.display = 'none'; };
document.getElementById('confirmDelete').onclick = () => {
    delete streetsData[streetName];
    localStorage.setItem('streetsData', JSON.stringify(streetsData));
    streets = streets.filter(s => s !== streetName);
    localStorage.setItem('streets', JSON.stringify(streets));
    if(streetObjects[streetName]){
        delete streetObjects[streetName];
        localStorage.setItem('streetObjects', JSON.stringify(streetObjects));
    }
    window.location.href = 'index.html';
};
</script>

</body>
</html>
