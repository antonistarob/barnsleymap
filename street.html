<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Info</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: #eee;
        padding: 20px;
    }

    a {
        color: #4a90e2;
        text-decoration: none;
    }

    h1 {
        margin-bottom: 10px;
    }

    /* --- Popup Styles --- */
    .popup-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.7);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .popup {
        background: #1f1f1f;
        padding: 25px;
        border-radius: 10px;
        width: 400px; 
        max-width: 90%;
        box-sizing: border-box;
        color: #eee;
        border: 1px solid #444;
    }

    .popup h3 {
        text-align: center;
        margin-top: 0;
        color: #fff;
    }

    .popup label {
        display: block;
        margin-top: 10px;
    }

    .popup input[type="text"],
    .popup textarea,
    .popup select {
        width: 100%;
        padding: 5px;
        margin-top: 5px;
        box-sizing: border-box;
        background-color: #2b2b2b;
        color: #eee;
        border: 1px solid #555;
        border-radius: 5px;
    }

    .popup input[type="checkbox"] {
        transform: scale(1.2);
        margin-right: 5px;
    }

    .popup-buttons {
        margin-top: 15px;
        display: flex;
        justify-content: space-between;
    }

    /* --- Action Buttons (Edit/Delete) --- */
    .action-button {
        cursor: pointer;
        background-color: #333;   /* same as Add Street */
        color: #eee;
        border: 1px solid #555;
        border-radius: 5px;
        padding: 5px 10px;
        font-size: 14px;
    }

    .action-button:hover {
        background-color: #444;   /* hover effect same as Add Street */
    }
</style>
</head>
<body>

    <a href="index.html">Back to Map</a>

<h1 id="streetTitle"></h1>

<p id="existingWrapper"><strong>Existing:</strong> <span id="streetExisting"></span></p>
<p id="descriptionWrapper"><strong>Description:</strong> <span id="streetDescription"></span></p>
    
<!-- Objects Table -->
<h2>Objects on this street</h2>
<table id="objectsTable" style="width:100%; border-collapse: collapse; margin-top:10px;">
    <thead>
        <tr>
            <th style="text-align:left; border-bottom:1px solid #555; padding:5px;">Street Number</th>
            <th style="text-align:left; border-bottom:1px solid #555; padding:5px;">Building Name</th>
        </tr>
    </thead>
    <tbody>
        <!-- Dynamically filled -->
    </tbody>
</table>

<!-- AddObject/Edit/Delete Buttons -->
<div id="streetButtons" style="margin-top:15px;">
    <button id="addObjectBtn" class="action-button">Add Object</button>
    <button id="editBtn" class="action-button">Edit</button>
    <button id="deleteStreet" class="action-button">Delete</button>
</div>

<!-- Edit Street Popup -->
<div class="popup-overlay" id="editPopupOverlay">
    <div class="popup">
        <h3>Edit Street</h3>
        <label for="editStreetName">Street Name:</label>
        <input type="text" id="editStreetName">

        <label for="editDistrict">District:</label>
        <select id="editDistrict">
            <option value="Town Centre">Town Centre</option>
            <!-- Add more districts here if needed -->
        </select>

        <label>
            <input type="checkbox" id="editExisting"> Existing
        </label>

        <label for="editDescription">Description:</label>
        <textarea id="editDescription" rows="3"></textarea>

        <div class="popup-buttons">
            <button id="saveEditStreet">Save</button>
            <button id="cancelEditStreet">Cancel</button>
        </div>
    </div>
</div>

<!-- Delete Confirmation Popup -->
<div class="popup-overlay" id="deletePopupOverlay">
    <div class="popup">
        <h3>Delete Street</h3>
        <p id="deleteMessage">Are you sure you want to delete this street?</p>
        <div class="popup-buttons">
            <button id="confirmDelete" class="action-button">Yes</button>
            <button id="cancelDelete" class="action-button">Cancel</button>
        </div>
    </div>
</div>
    
<script>
    // Helper function to get URL parameter
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    const streetName = getQueryParam('name');

    if(streetName) {
        // Show street name
        document.getElementById('streetTitle').textContent = streetName;

        // Load street info from localStorage
        const streetData = JSON.parse(localStorage.getItem('streetsData')) || {};
        const data = streetData[streetName] || {};

       // District always shows
    <p><strong>District:</strong> <span id="streetDistrict"></span></p>
document.getElementById('streetDistrict').textContent = data.district || 'N/A';

// Existing: hide if true
const existingWrapper = document.getElementById('existingWrapper');
const existingEl = document.getElementById('streetExisting');
if (data.existing === false) {
    existingWrapper.style.display = 'block';
    existingEl.textContent = 'No';
} else {
    existingWrapper.style.display = 'none';
}

// Description: hide completely if empty
const descriptionWrapper = document.getElementById('descriptionWrapper');
const descEl = document.getElementById('streetDescription');
if (data.description && data.description.trim() !== '') {
    descriptionWrapper.style.display = 'block';
    descEl.textContent = data.description;
} else {
    descriptionWrapper.style.display = 'none';
}

    // --- Edit Street Popup ---
const editBtn = document.getElementById('editBtn');
const editPopupOverlay = document.getElementById('editPopupOverlay');
const cancelEditStreet = document.getElementById('cancelEditStreet');
const saveEditStreet = document.getElementById('saveEditStreet');

const editStreetNameInput = document.getElementById('editStreetName');
const editDistrictInput = document.getElementById('editDistrict');
const editExistingInput = document.getElementById('editExisting');
const editDescriptionInput = document.getElementById('editDescription');

// Open edit popup with current street data
editBtn.addEventListener('click', () => {
    const streetData = JSON.parse(localStorage.getItem('streetsData')) || {};
    const data = streetData[streetName] || {};

    editStreetNameInput.value = streetName;
    editDistrictInput.value = data.district || 'Town Centre';
    editExistingInput.checked = data.existing !== undefined ? data.existing : true;
    editDescriptionInput.value = data.description || '';

    editPopupOverlay.style.display = 'flex';
});

// Cancel edit
cancelEditStreet.addEventListener('click', () => {
    editPopupOverlay.style.display = 'none';
});

// Save edit
saveEditStreet.addEventListener('click', () => {
    const newName = editStreetNameInput.value.trim();
    const newDistrict = editDistrictInput.value.trim();
    const newExisting = editExistingInput.checked;
    const newDescription = editDescriptionInput.value.trim();

    if(newName !== '') {
        let streetsData = JSON.parse(localStorage.getItem('streetsData')) || {};

        // If street name changed, update key
        if(newName !== streetName) {
            // Copy old data to new key
            streetsData[newName] = { district: newDistrict, existing: newExisting, description: newDescription };
            delete streetsData[streetName];

            // Update streets list in localStorage
            let streetsList = JSON.parse(localStorage.getItem('streets')) || [];
            streetsList = streetsList.map(s => s === streetName ? newName : s);
            localStorage.setItem('streets', JSON.stringify(streetsList));
        } else {
            // Just update fields
            streetsData[newName] = { district: newDistrict, existing: newExisting, description: newDescription };
        }

        localStorage.setItem('streetsData', JSON.stringify(streetsData));

        // Close popup
        editPopupOverlay.style.display = 'none';

        // Redirect to the new street URL if the name changed, otherwise reload same page
        if(newName !== streetName) {
            window.location.href = 'street.html?name=' + encodeURIComponent(newName);
        } else {
            window.location.reload();
        }
    }
});

    // --- Delete Street Popup ---
const deleteBtn = document.getElementById('deleteStreet');
const deletePopupOverlay = document.getElementById('deletePopupOverlay');
const cancelDelete = document.getElementById('cancelDelete');
const confirmDelete = document.getElementById('confirmDelete');
const deleteMessage = document.getElementById('deleteMessage');

// Open delete popup
deleteBtn.addEventListener('click', () => {
    // Insert the street name dynamically
    const deleteMessage = document.getElementById('deleteMessage');
deleteMessage.innerHTML = `Are you sure you want to delete <b>${streetName}</b>?`;

    deletePopupOverlay.style.display = 'flex';
});

// Cancel delete
cancelDelete.addEventListener('click', () => {
    deletePopupOverlay.style.display = 'none';
});

// Confirm delete
confirmDelete.addEventListener('click', () => {
    // Remove street from streetsData
    let streetsData = JSON.parse(localStorage.getItem('streetsData')) || {};
    delete streetsData[streetName];
    localStorage.setItem('streetsData', JSON.stringify(streetsData));

    // Remove street from streets list
    let streetsList = JSON.parse(localStorage.getItem('streets')) || [];
    streetsList = streetsList.filter(s => s !== streetName);
    localStorage.setItem('streets', JSON.stringify(streetsList));

    // Close popup and go back to index
    deletePopupOverlay.style.display = 'none';
    window.location.href = 'index.html';
});

    const addObjectBtn = document.getElementById('addObjectBtn');
const objectsTableBody = document.querySelector('#objectsTable tbody');

// Load objects for this street
let streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
let objects = streetObjects[streetName] || [];
objects.forEach(obj => addObjectRow(obj.number, obj.name));

// Function to add a row to the table
function addObjectRow(number, name) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td style="padding:5px; border-bottom:1px solid #555;">${number}</td>
        <td style="padding:5px; border-bottom:1px solid #555;">${name}</td>
    `;
    objectsTableBody.appendChild(tr);
}

// Add Object popup (simplified for now)
addObjectBtn.addEventListener('click', () => {
    const number = prompt('Enter Street Number:');
    if(!number) return;
    const name = prompt('Enter Building Name:');
    if(!name) return;

    // Save to localStorage
    objects.push({number, name});
    streetObjects[streetName] = objects;
    localStorage.setItem('streetObjects', JSON.stringify(streetObjects));

    // Add to table
    addObjectRow(number, name);
});
</script>

</body>
</html>
