<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Street Page</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body { font-family: Arial; margin:0; padding:0; background:#f5f5f5; }
header { background:#f0f0f0; color:black; padding:15px; display:flex; justify-content:space-between; align-items:center; }
header h1 { margin:0; cursor:pointer; }
header h1:hover { text-decoration: underline; }
header .auth-buttons button { margin-left:10px; padding:6px 12px; cursor:pointer; }

.street-info { margin:20px; padding:15px; background:white; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
.street-info h1 { margin:0; font-weight:bold; }
.street-info #directory { font-size:0.9em; color:#555; margin-top:5px; }
.street-buttons { margin-top:10px; }
.street-buttons button { margin-right:10px; padding:6px 12px; cursor:pointer; }

.container { display:flex; margin:20px; gap:20px; }
.left-column { width:250px; }
.left-column h2 { margin-top:0; display:flex; justify-content:space-between; align-items:center; }
.left-column ul { list-style:none; padding:0; }
.left-column li { margin:5px 0; display:flex; align-items:center; }
.number-box { width:40px; height:30px; background:white; display:flex; justify-content:center; align-items:center; margin-right:5px; border:1px solid #ccc; border-radius:4px; }
.object-name { cursor:pointer; color:#007bff; }
.object-name:hover { text-decoration:underline; }

.right-column { flex:1; }
#streetMap { width:100%; height:500px; border-radius:6px; }

button { padding:6px 12px; margin:5px; cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1 onclick="window.location.href='index.html'">Historical Interactive Map of Barnsley</h1>
  <div class="auth-buttons">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Log In</button>
  </div>
</header>

<!-- STREET INFO + BUTTONS -->
<div class="street-info">
  <h1 id="streetNameBold"></h1>
  <div id="directory"></div>
  <div class="street-buttons">
    <button onclick="openEditStreet()">Edit</button>
    <button onclick="openEditMap()">Edit Map</button>
    <button onclick="deleteStreet()" style="background:#d9534f;color:white;">Delete</button>
  </div>
</div>

<div class="container">
  <!-- LEFT COLUMN: Objects List -->
  <div class="left-column">
    <h2>
      Objects
      <button onclick="openCreateObject()">Create Object</button>
    </h2>
    <ul id="objectList"></ul>
  </div>

  <!-- RIGHT COLUMN: Map -->
  <div class="right-column">
    <div id="streetMap"></div>
  </div>
</div>

<script>
// ---------------- AUTH MOCK ----------------
function signup(){ alert("Sign Up clicked"); }
function login(){ alert("Log In clicked"); }

// ---------------- STREET DATA ----------------
let street = localStorage.getItem("currentStreet");
if(!street){
  alert("No street selected!");
  window.location.href = "index.html";
}
document.getElementById("streetNameBold").innerText = street;

// ---------------- DIRECTORY ----------------
document.getElementById("directory").innerHTML =
  `United Kingdom &gt; England &gt; South Yorkshire &gt; 
   <span style="cursor:pointer; color:#007bff;" onclick="window.location.href='index.html'">Barnsley</span> &gt; 
   <b>${street}</b>`;

// ---------------- STREET BUTTON FUNCTIONS ----------------
function openEditStreet(){
  window.open("street-edit.html", "EditStreet", "width=400,height=200,resizable=no");
}

function openEditMap(){
  window.open("street-map.html", "EditMap", "width=600,height=600,resizable=no");
}

function deleteStreet(){
  if(confirm("Are you sure you want to delete this street and all its objects?")){
    // Remove all objects for this street
    const ids = JSON.parse(localStorage.getItem(street + "_objectIDs")) || [];
    ids.forEach(id=>{
      localStorage.removeItem("object_" + id);
      localStorage.removeItem("object_" + id + "_location");
    });
    localStorage.removeItem(street + "_objectIDs");
    localStorage.removeItem(street + "_location");
    localStorage.removeItem("currentStreet");
    alert("Street deleted");
    window.location.href = "index.html";
  }
}

// ---------------- OBJECT LIST ----------------
function openCreateObject(){
  if(!street){ alert("No street selected"); return; }
  window.open("object-create.html", "CreateObject", "width=450,height=520,resizable=no");
}

function renderObjects(){
  const listEl = document.getElementById("objectList");
  listEl.innerHTML = "";
  let objectIDs = JSON.parse(localStorage.getItem(street + "_objectIDs")) || [];
  let objs = objectIDs.map(id => JSON.parse(localStorage.getItem("object_" + id)));
  objs.sort((a,b)=>a.number.localeCompare(b.number, undefined, {numeric:true, sensitivity:'base'}));
  objs.forEach(obj=>{
    let li = document.createElement("li");
    li.innerHTML = `<div class="number-box">${obj.number}</div>
                    <span class="object-name" onclick="openObject('${obj.id}')">${obj.name}</span>`;
    listEl.appendChild(li);
  });
}

function openObject(id){
  localStorage.setItem("currentObjectID", id);
  window.location.href = "object.html";
}

// ---------------- MAP ----------------
const map = L.map('streetMap').setView([53.5526, -1.4820], 17);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

function renderStreetMarkers(){
  if(window.markersGroup){
    window.markersGroup.clearLayers();
  } else {
    window.markersGroup = L.layerGroup().addTo(map);
  }

  const objectIDs = JSON.parse(localStorage.getItem(street + "_objectIDs")) || [];
  objectIDs.forEach(id=>{
    const obj = JSON.parse(localStorage.getItem("object_" + id));
    const loc = JSON.parse(localStorage.getItem("object_" + id + "_location"));
    if(loc){
      const marker = L.marker([loc.lat, loc.lng]).addTo(window.markersGroup)
        .bindPopup(obj.name);
      marker.on('click', ()=>openObject(id));
      marker.on('dragend', function(){
        localStorage.setItem("object_" + id + "_location", JSON.stringify(marker.getLatLng()));
      });
    }
  });
}

// ---------------- INITIAL RENDER ----------------
renderObjects();
renderStreetMarkers();
</script>
</body>
</html>
