<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Street Details</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body { font-family: Arial; margin:0; padding:0; background:#f5f5f5; }
header { 
  background:#f0f0f0; 
  color:black; 
  padding:15px; 
  display:flex; 
  justify-content:space-between; 
  align-items:center; 
}
header h1 { margin:0; cursor:pointer; }
header h1:hover { text-decoration: underline; }
header .auth-buttons button { margin-left:10px; padding:6px 12px; cursor:pointer; }

.container { margin:20px auto; max-width:800px; background:white; padding:20px; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }

h2 { margin-top:0; }
button { padding:6px 12px; margin:5px; cursor:pointer; }

#objectsList { margin-top:20px; }
.objectRow { display:flex; align-items:center; margin-bottom:5px; }
.numberBox { width:40px; height:24px; background:white; border:1px solid #ccc; text-align:center; margin-right:8px; display:flex; align-items:center; justify-content:center; border-radius:3px; }

#streetMapDiv { width:100%; height:400px; border-radius:6px; margin-top:20px; }
#directory { font-size:0.9em; color:#555; margin-bottom:10px; }

.section { margin-top:20px; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <h1 onclick="window.location.href='index.html'">Historical Interactive Map of Barnsley</h1>
  <div class="auth-buttons">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Log In</button>
  </div>
</header>

<div class="container">
  <!-- Street Title -->
  <h2 id="streetName"></h2>
  <div id="directory"></div>

  <!-- Action Buttons -->
  <button onclick="createObject()">Create Object</button>
  <button onclick="toggleMap()">Map</button>

  <!-- Objects Column -->
  <div id="objectsList"></div>

  <!-- MAP SECTION -->
  <div class="section" id="mapSection" style="display:none;">
    <h3>Street Map</h3>
    <div id="streetMapDiv"></div>
    <small>Click on the map to place or adjust the street location.</small>
  </div>
</div>

<script>
// ---------------- AUTH MOCK ----------------
function signup(){ alert("Sign Up clicked"); }
function login(){ alert("Log In clicked"); }

// ---------------- LOAD STREET ----------------
const street = localStorage.getItem("currentStreet");
document.getElementById("streetName").innerText = street;

// Directory line with clickable Barnsley
document.getElementById("directory").innerHTML =
  `United Kingdom &gt; England &gt; South Yorkshire &gt; 
   <span style="cursor:pointer; color:#007bff;" onclick="window.location.href='index.html'">Barnsley</span> &gt; 
   ${street}`;

// ---------------- LOAD OBJECTS ----------------
let objects = JSON.parse(localStorage.getItem(street + "_objects")) || [];

function renderObjects(){
  const container = document.getElementById("objectsList");
  container.innerHTML = "";
  // Sort by street number
  objects.sort((a,b) => parseInt(a.number) - parseInt(b.number));
  objects.forEach((obj, idx) => {
    const row = document.createElement("div");
    row.className = "objectRow";
    row.innerHTML = `
      <div class="numberBox">${obj.number}</div>
      <span style="cursor:pointer; color:#007bff;" onclick="openObject(${idx})">[${obj.type}] ${obj.name}</span>
    `;
    container.appendChild(row);
  });
}
renderObjects();

// ---------------- CREATE OBJECT ----------------
function createObject(){
  const number = prompt("Street Number:");
  const name = prompt("Object Name:");
  if(!number || !name) return;
  const type = prompt("Object Type (Building, Church, School, etc.):");
  objects.push({number, name, type, status:"Exists"});
  localStorage.setItem(street + "_objects", JSON.stringify(objects));
  renderObjects();
}

// ---------------- OPEN OBJECT ----------------
function openObject(idx){
  localStorage.setItem("currentObjectIndex", idx);
  window.location.href = "object.html";
}

// ---------------- MAP SECTION ----------------
let map, marker;
function toggleMap(){
  const mapSection = document.getElementById("mapSection");
  if(mapSection.style.display === "none"){
    mapSection.style.display = "block";

    const savedLocation = JSON.parse(localStorage.getItem(street + "_location"));

    map = L.map('streetMapDiv').setView(savedLocation ? [savedLocation.lat, savedLocation.lng] : [53.5526, -1.4820], 17);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    if(savedLocation){
      marker = L.marker([savedLocation.lat, savedLocation.lng], {draggable:true}).addTo(map)
               .bindPopup(street)
               .openPopup();
    }

    map.on('click', function(e){
      const latlng = e.latlng;
      if(marker) marker.setLatLng(latlng);
      else marker = L.marker(latlng, {draggable:true}).addTo(map).bindPopup(street).openPopup();

      // Save street location
      localStorage.setItem(street + "_location", JSON.stringify({lat:latlng.lat, lng:latlng.lng}));
      alert("Street location saved!");
    });

  } else {
    mapSection.style.display = "none";
  }
}
</script>

</body>
</html>
