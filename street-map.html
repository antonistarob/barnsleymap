<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Set Street Location</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css"/>
<script src="https://js.arcgis.com/4.29/"></script>

<style>
html, body, #viewDiv {
  padding:0;
  margin:0;
  height:100%;
  width:100%;
}
button {
  position:absolute;
  top:10px;
  left:10px;
  z-index:99;
  padding:8px 12px;
}
</style>
</head>

<body>

<button onclick="saveLocation()">Save Location</button>
<div id="viewDiv"></div>

<script>
require([
  "esri/config",
  "esri/Map",
  "esri/views/MapView",
  "esri/Graphic",
  "esri/layers/GraphicsLayer"
], function(esriConfig, Map, MapView, Graphic, GraphicsLayer) {

  esriConfig.apiKey = "AAPTxy8BH1VEsoebNVZXo8HurF9ISRTrAh1OrRfmL2PhQzmZtXOAqDthSV6k7MMV3d9A0I8Yzm8893mWylV-AAzjHW8Vdje5nHbcCoWP8oTym3uv8avVcv3Vo0378-pNaQV4lBazkO4PICEb7s0wAYVjvz431sxHmWEOmvQBV_CFHX8jVjCLIgSL9VflJACm47m1x6ZEzK3oOJxg3TmVwHL4Qy_o8flbD_c7ThfAebykl1o.AT1_J9TBjsr2";

  const street = localStorage.getItem("currentStreet");

  const map = new Map({
    basemap: "arcgis-light-gray"
  });

  const view = new MapView({
    container: "viewDiv",
    map: map,
    center: [-1.4820, 53.5526],
    zoom: 14
  });

  const graphicsLayer = new GraphicsLayer();
  map.add(graphicsLayer);

  let selectedPoint = null;

  view.on("click", function(event){
    graphicsLayer.removeAll();

    selectedPoint = {
      lat: event.mapPoint.latitude,
      lng: event.mapPoint.longitude
    };

    const pointGraphic = new Graphic({
      geometry: event.mapPoint,
      symbol: {
        type: "simple-marker",
        color: "red",
        size: "12px"
      }
    });

    graphicsLayer.add(pointGraphic);
  });

  window.saveLocation = function(){
    if(selectedPoint){
      localStorage.setItem(street + "_location", JSON.stringify(selectedPoint));
      alert("Location saved!");
      window.location.href = "street.html";
    } else {
      alert("Click on the map first.");
    }
  }

});
</script>

</body>
</html>
