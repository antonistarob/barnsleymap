<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Set Street Location</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body { font-family: Arial; margin:0; padding:20px; }
#mapDiv { width:100%; height:500px; margin-top:10px; border-radius:6px; }
button { padding:6px 12px; margin-top:10px; cursor:pointer; }
</style>
</head>
<body>

<h2 id="streetName"></h2>
<p>Click on the map to set street location.</p>
<div id="mapDiv"></div>
<button onclick="saveLocation()">Save Location</button>

<script>
let street = localStorage.getItem("currentStreet");
if(!street){ alert("No street selected"); window.close(); }
document.getElementById("streetName").innerText = street;

let map = L.map('mapDiv').setView([53.5526,-1.4820],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ attribution:'&copy; OpenStreetMap contributors' }).addTo(map);

let saved = JSON.parse(localStorage.getItem(street + "_location"));
let marker = null;
if(saved){ marker = L.marker([saved.lat, saved.lng]).addTo(map); map.setView([saved.lat, saved.lng],16); }

map.on('click', function(e){
  if(marker) map.removeLayer(marker);
  marker = L.marker([e.latlng.lat,e.latlng.lng]).addTo(map);
});

function saveLocation(){
  if(!marker){ alert("Click map to place marker"); return; }
  const latlng = marker.getLatLng();
  localStorage.setItem(street + "_location", JSON.stringify({lat:latlng.lat,lng:latlng.lng}));
  alert("Location saved!");
  window.close();
}
</script>
</body>
</html>
