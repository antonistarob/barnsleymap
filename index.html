<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historical Interactive Map of Barnsley</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
    /* --- Body --- */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #121212; /* Dark background */
        color: #eee; /* Light text */
        padding: 0;
    }

    /* --- Header --- */
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background-color: #1f1f1f; /* Dark gray header */
        color: #eee;
        width: 100%;
        box-sizing: border-box;
    }

    header h1 {
        margin: 0;
        font-size: 24px;
        color: #fff;
    }

    .auth-buttons button {
        margin-left: 10px;
        padding: 5px 10px;
        cursor: pointer;
        background-color: #333;
        color: #eee;
        border: 1px solid #555;
        border-radius: 5px;
    }

    .auth-buttons button:hover {
        background-color: #444;
    }

    /* --- Sections --- */
    section {
        padding: 0 20px;
    }

    h2 {
        margin-top: 30px;
        font-size: 20px;
        color: #fff;
    }

    button {
        cursor: pointer;
        background-color: #333;
        color: #eee;
        border: 1px solid #555;
        border-radius: 5px;
        padding: 5px 10px;
    }

    button:hover {
        background-color: #444;
    }

    #addStreetBtn {
        margin-left: 15px;
    }

    ul#streetList {
        list-style: none;
        padding: 0;
        margin-top: 10px;
    }

    ul#streetList li {
        background: #1f1f1f;
        margin-bottom: 5px;
        padding: 10px;
        border-radius: 5px;
        color: #eee;
        border: 1px solid #333;
    }

    /* --- Popup Styles --- */
    .popup-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.7);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .popup {
        background: #1f1f1f;
        padding: 25px;
        border-radius: 10px;
        width: 400px; 
        max-width: 90%;
        box-sizing: border-box;
        color: #eee;
        border: 1px solid #444;
    }

    .popup h3 {
        text-align: center;
        font-weight: bold;
        margin-top: 0;
        color: #fff;
    }

    .popup label {
        display: block;
        margin-top: 10px;
    }

    .popup input[type="text"], .popup textarea {
        width: 100%;
        padding: 5px;
        margin-top: 5px;
        box-sizing: border-box;
        background-color: #2b2b2b;
        color: #eee;
        border: 1px solid #555;
        border-radius: 5px;
    }

    .popup input[type="checkbox"] {
        transform: scale(1.2);
        margin-right: 5px;
    }

    .popup-buttons {
        margin-top: 15px;
        display: flex;
        justify-content: space-between;
    }

    /* --- Map --- */
    #map {
        height: 600px;
        margin-top: 20px;
        border-radius: 10px;
        border: 1px solid #333;
    }

</style>
</head>
<body>

<header>
    <h1>Historical Interactive Map of Barnsley</h1>
    <div class="auth-buttons">
        <button>Sign Up</button>
        <button>Log In</button>
    </div>
</header>

<section>
    <h2>Streets 
        <button id="addStreetBtn">Add Street</button>
    </h2>
    <ul id="streetList"></ul>
</section>

<!-- Popup -->
<div class="popup-overlay" id="popupOverlay">
    <div class="popup">
        <h3>Add Street</h3>
        <label for="streetName">Street Name:</label>
        <input type="text" id="streetName">

        <label for="district">District:</label>
        <input type="text" id="district">

        <label>
            <input type="checkbox" id="existing"> Existing
        </label>

        <label for="description">Description:</label>
        <textarea id="description" rows="3"></textarea>

        <div class="popup-buttons">
            <button id="saveStreet">Save</button>
            <button id="cancelStreet">Cancel</button>
        </div>
    </div>
</div>

<section>
    <h2>Map</h2>
    <div id="map"></div>
</section>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    // --- Popup Script ---
    const addStreetBtn = document.getElementById('addStreetBtn');
    const popupOverlay = document.getElementById('popupOverlay');
    const cancelStreet = document.getElementById('cancelStreet');

    addStreetBtn.addEventListener('click', () => {
        popupOverlay.style.display = 'flex';
    });
    cancelStreet.addEventListener('click', () => {
        popupOverlay.style.display = 'none';
    });

   // --- Street List with localStorage ---
const saveStreet = document.getElementById('saveStreet');
const streetList = document.getElementById('streetList');

let streets = JSON.parse(localStorage.getItem('streets')) || [];

// Helper function to create a clickable street item
function addStreetToList(name) {
    const li = document.createElement('li'); // Create the list item
    li.textContent = name;                    // Show the street name
    li.style.cursor = 'pointer';              // Make it look clickable

    // Click redirects to dynamic street page
    li.addEventListener('click', () => {
        const streetParam = encodeURIComponent(name);
        window.location.href = 'street.html?name=' + streetParam;
    });

    streetList.appendChild(li);
}

// Load streets on page load
streets.forEach(street => {
    addStreetToList(street);
});

// Save new street
saveStreet.addEventListener('click', () => {
    const name = document.getElementById('streetName').value.trim();
    if(name !== '') {
        addStreetToList(name);

        streets.push(name);
        localStorage.setItem('streets', JSON.stringify(streets));
    }

    // Clear inputs and close popup
    document.getElementById('streetName').value = '';
    document.getElementById('district').value = '';
    document.getElementById('existing').checked = false;
    document.getElementById('description').value = '';
    popupOverlay.style.display = 'none';
});

    // --- Map ---
const map = L.map('map').setView([53.5526, -1.4787], 14);

// Slightly lighter dark tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 20
}).addTo(map);
</script>

</body>
</html>
