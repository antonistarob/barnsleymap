<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Barnsley Archive</title>

<!-- Esri CSS and JS -->
<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css"/>
<script src="https://js.arcgis.com/4.29/"></script>

<style>
body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }

header {
  background:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

button { padding:6px 12px; margin:5px; cursor:pointer; }

section { padding:20px; }

#slider {
  background:white;
  padding:20px;
  text-align:center;
  font-size:20px;
  height:60px;
}

#viewDiv {
  height:400px;
  margin-top:20px;
}

ul { list-style:none; padding:0; }

.street-link {
  cursor:pointer;
  color:blue;
  text-decoration:underline;
  margin:3px 0;
}

.directory {
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h2>Barnsley Archive</h2>
  <div>
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Log In</button>
  </div>
</header>

<section>
  <h3>Most Viewed Photos</h3>
  <div id="slider"></div>
</section>

<section>
  <h3>Map</h3>
  <div id="viewDiv"></div>
</section>

<section>
  <h3>Directory</h3>
  <p class="directory">United Kingdom > England > South Yorkshire > Barnsley</p>
  <button onclick="addStreet()">Add Street</button>

  <h4>Streets</h4>
  <ul id="streetList"></ul>
</section>

<script>
/* ---------------- LOGIN SYSTEM ---------------- */
function signup(){
  let user = prompt("Enter username:");
  if(user){
    localStorage.setItem("user", user);
    alert("Signed up as " + user);
  }
}

function login(){
  let user = prompt("Enter username:");
  if(localStorage.getItem("user") === user){
    alert("Welcome back " + user);
  } else {
    alert("User not found.");
  }
}

/* ---------------- MOST VIEWED PHOTOS ---------------- */
let photos = [
  "Town Centre 1950",
  "Market Street 1932",
  "Old Barnsley Station",
  "Church Street 1960"
];
let index = 0;
function rotatePhotos(){
  document.getElementById("slider").innerText = photos[index];
  index = (index + 1) % photos.length;
}
setInterval(rotatePhotos, 3000);
rotatePhotos();

/* ---------------- STREETS SYSTEM ---------------- */
let streets = JSON.parse(localStorage.getItem("streets")) || [];

function renderStreets(){
  streets.sort();
  let list = document.getElementById("streetList");
  list.innerHTML = "";
  streets.forEach(street=>{
    let li = document.createElement("li");
    li.innerHTML = `<span class="street-link" onclick="openStreet('${street}')">${street}</span>`;
    list.appendChild(li);
  });
}

function addStreet(){
  let name = prompt("Enter street name:");
  if(name){
    streets.push(name);
    localStorage.setItem("streets", JSON.stringify(streets));
    renderStreets();
  }
}

function openStreet(street){
  localStorage.setItem("currentStreet", street);
  window.location.href = "street.html";
}

renderStreets();

/* ---------------- ESRI MAP ---------------- */
require([
  "esri/config",
  "esri/Map",
  "esri/views/MapView",
  "esri/Graphic",
  "esri/layers/GraphicsLayer"
], function(esriConfig, Map, MapView, Graphic, GraphicsLayer) {

  esriConfig.apiKey = "YOUR_NEW_API_KEY_HERE"; // <-- your secure key

  const map = new Map({
    basemap: "arcgis-light-gray"
  });

  const view = new MapView({
    container: "viewDiv",
    map: map,
    center: [-1.4820, 53.5526], // Barnsley center
    zoom: 13
  });

  const graphicsLayer = new GraphicsLayer();
  map.add(graphicsLayer);

  let streets = JSON.parse(localStorage.getItem("streets")) || [];

  streets.forEach(street => {
    // Only show streets that have a location
    let location = JSON.parse(localStorage.getItem(street + "_location"));
    if(location){
      const pointGraphic = new Graphic({
        geometry: {
          type: "point",
          longitude: location.lng,
          latitude: location.lat
        },
        symbol: {
          type: "simple-marker",
          color: "blue",
          size: "10px"
        },
        popupTemplate: {
          title: street,
          content: `<button onclick="openStreetFromMap('${street}')">Open Street</button>`
        }
      });

      graphicsLayer.add(pointGraphic);

      // Optional: zoom map to first saved street
      if(street === streets[0]){
        view.center = [location.lng, location.lat];
        view.zoom = 16;
      }
    }
  });

  window.openStreetFromMap = function(street){
    localStorage.setItem("currentStreet", street);
    window.location.href = "street.html";
  }

});

</script>

</body>
</html>
