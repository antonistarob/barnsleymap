<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historical Interactive Map of Barnsley</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
    /* --- Reset body padding only for header --- */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0 20px;
        background-color: #f7f7f7;
    }
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background-color: #888; /* Gray header */
        color: white;
        width: 100vw; /* Full width */
        box-sizing: border-box;
    }
    header h1 {
        margin: 0;
        font-size: 24px;
    }
    .auth-buttons button {
        margin-left: 10px;
        padding: 5px 10px;
        cursor: pointer;
    }
    h2 {
        margin-top: 30px;
        font-size: 20px;
    }
    button {
        cursor: pointer;
    }
    #addStreetBtn {
        margin-left: 15px;
        padding: 5px 10px;
    }
    ul#streetList {
        list-style: none;
        padding: 0;
        margin-top: 10px;
    }
    ul#streetList li {
        background: white;
        margin-bottom: 5px;
        padding: 10px;
        border-radius: 5px;
    }

    /* --- Popup Styles --- */
    .popup-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .popup {
        background: white;
        padding: 25px;
        border-radius: 10px;
        width: 400px; /* Bigger popup */
        max-width: 90%;
        box-sizing: border-box;
    }
    .popup h3 {
        text-align: center;
        font-weight: bold;
        margin-top: 0;
    }
    .popup label {
        display: block;
        margin-top: 10px;
    }
    .popup input[type="text"], .popup textarea {
        width: 100%;
        padding: 5px;
        margin-top: 5px;
        box-sizing: border-box;
    }
    .popup-buttons {
        margin-top: 15px;
        display: flex;
        justify-content: space-between;
    }

    /* --- Map Styles --- */
    #map {
        height: 400px;
        margin-top: 20px;
        border-radius: 10px;
    }
</style>
</head>
<body>

<header>
    <h1>Historical Interactive Map of Barnsley</h1>
    <div class="auth-buttons">
        <button>Sign Up</button>
        <button>Log In</button>
    </div>
</header>

<section>
    <h2>Streets 
        <button id="addStreetBtn">Add Street</button>
    </h2>
    <ul id="streetList"></ul>
</section>

<!-- Popup for Adding Street -->
<div class="popup-overlay" id="popupOverlay">
    <div class="popup">
        <h3>Add Street</h3>
        <label for="streetName">Street Name:</label>
        <input type="text" id="streetName">

        <label for="district">District:</label>
        <input type="text" id="district">

        <label>
            <input type="checkbox" id="existing"> Existing
        </label>

        <label for="description">Description:</label>
        <textarea id="description" rows="3"></textarea>

        <div class="popup-buttons">
            <button id="saveStreet">Save</button>
            <button id="cancelStreet">Cancel</button>
        </div>
    </div>
</div>

<section>
    <h2>Map</h2>
    <div id="map"></div>
</section>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    // --- Popup Script ---
    const addStreetBtn = document.getElementById('addStreetBtn');
    const popupOverlay = document.getElementById('popupOverlay');
    const cancelStreet = document.getElementById('cancelStreet');

    addStreetBtn.addEventListener('click', () => {
        popupOverlay.style.display = 'flex';
    });
    cancelStreet.addEventListener('click', () => {
        popupOverlay.style.display = 'none';
    });

    // --- Street List Script ---
    const saveStreet = document.getElementById('saveStreet');
    const streetList = document.getElementById('streetList');

    // Load streets from localStorage on page load
    let streets = JSON.parse(localStorage.getItem('streets')) || [];
    streets.forEach(street => {
        const li = document.createElement('li');
        li.textContent = street;
        streetList.appendChild(li);
    });

    saveStreet.addEventListener('click', () => {
        const name = document.getElementById('streetName').value.trim();
        if(name !== '') {
            const li = document.createElement('li');
            li.textContent = name;
            streetList.appendChild(li);

            streets.push(name);
            localStorage.setItem('streets', JSON.stringify(streets));
        }
        // Clear inputs and close popup
        document.getElementById('streetName').value = '';
        document.getElementById('district').value = '';
        document.getElementById('existing').checked = false;
        document.getElementById('description').value = '';
        popupOverlay.style.display = 'none';
    });

    // --- Map Script ---
    const map = L.map('map').setView([53.5526, -1.4787], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
</script>

</body>
</html>
