<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historical Interactive Map of Barnsley</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #121212;
        color: #eee;
        padding: 0;
    }
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background-color: #1f1f1f;
        color: #eee;
        width: 100%;
        box-sizing: border-box;
    }
    header h1 { margin:0; font-size:24px; color:#fff; }
    .auth-buttons button {
        margin-left:10px; padding:5px 10px; cursor:pointer;
        background:#333; color:#eee; border:1px solid #555; border-radius:5px;
    }
    .auth-buttons button:hover { background:#444; }

    section { padding: 0 20px; }
    h2 { margin-top:30px; font-size:20px; color:#fff; }
    button { cursor:pointer; background:#333; color:#eee; border:1px solid #555; border-radius:5px; padding:5px 10px; }
    button:hover { background:#444; }

    #addStreetBtn { margin-left:15px; }
    ul#streetList { list-style:none; padding:0; margin-top:10px; }
    ul#streetList li {
        background:#1f1f1f; margin-bottom:5px; padding:10px; border-radius:5px;
        color:#eee; border:1px solid #333; cursor:pointer;
    }

    .popup-overlay {
        display:none; position:fixed; top:0; left:0; width:100%; height:100%;
        background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:1000;
    }
    .popup {
        background:#1f1f1f; padding:25px; border-radius:10px; width:400px; max-width:90%;
        box-sizing:border-box; color:#eee; border:1px solid #444;
    }
    .popup h3 { text-align:center; margin-top:0; color:#fff; }
    .popup label { display:block; margin-top:10px; }
    .popup input[type="text"], .popup textarea, .popup select {
        width:100%; padding:5px; margin-top:5px; box-sizing:border-box;
        background:#2b2b2b; color:#eee; border:1px solid #555; border-radius:5px;
    }
    .popup input[type="checkbox"] { transform:scale(1.2); margin-right:5px; }
    .popup-buttons { margin-top:15px; display:flex; justify-content:space-between; }

    #map { height:600px; margin-top:20px; border-radius:10px; border:1px solid #333; }
</style>
</head>
<body>

<header>
    <h1>Historical Interactive Map of Barnsley</h1>
    <div class="auth-buttons">
        <button>Sign Up</button>
        <button>Log In</button>
    </div>
</header>

<section>
<h2 style="display:flex; align-items:center; gap:10px;">
    <span>Streets</span>
    <button id="addStreetBtn">Add Street</button>
    <input type="text" id="streetSearch" placeholder="Search streets..." style="flex:1; padding:5px; border-radius:5px; border:1px solid #555; background-color:#2b2b2b; color:#eee;">
</h2>
<ul id="streetList"></ul>
</section>

<div class="popup-overlay" id="popupOverlay">
    <div class="popup">
        <h3>Add Street</h3>
        <label for="streetName">Street Name:</label>
        <input type="text" id="streetName">

        <label for="district">District:</label>
        <select id="district">
            <option value="Town Centre">Town Centre</option>
        </select>

        <label><input type="checkbox" id="existing" checked> Existing</label>
        <label for="description">Description:</label>
        <textarea id="description" rows="3"></textarea>

        <div class="popup-buttons">
            <button id="saveStreet">Save</button>
            <button id="cancelStreet">Cancel</button>
        </div>
    </div>
</div>

<section>
    <h2>Map</h2>
    <div id="map"></div>
</section>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    const categoryIcons = {
    // Buildings
    "Apartment block": "https://polska-org.pl/gfx/category/3258201.png",
    "Cottage": "https://polska-org.pl/gfx/category/500129.png",
    "Detached house": "https://polska-org.pl/gfx/category/6216777.png",
    "Palace/Manor": "https://polska-org.pl/gfx/obj/05h.png",
    "Semi-detached house": "https://polska-org.pl/gfx/category/500046.png",
    "Single-family house": "https://polska-org.pl/gfx/category/500129.png",
    "Terraced house": "https://polska-org.pl/gfx/category/500046.png",
    "Townhouse": "https://polska-org.pl/gfx/category/500045.png",
    "Villa": "https://polska-org.pl/gfx/obj/05c.png",

    // Education and learning
    "Nursery": "https://polska-org.pl/gfx/obj/03b.png",
    "Primary school": "https://polska-org.pl/gfx/obj/03c.png",
    "Secondary school": "https://polska-org.pl/gfx/obj/03d.png",
    "Sixth Form college": "https://polska-org.pl/gfx/obj/03e.png",
    "College": "https://polska-org.pl/gfx/obj/03e.png",
    "University": "https://polska-org.pl/gfx/obj/03e.png",

    // Bank and handle
    "Bank": "https://polska-org.pl/gfx/obj/11d.png",
    "Shopping centre": "https://polska-org.pl/gfx/obj/11b.png",
    "Supermarket": "https://polska-org.pl/gfx/obj/11b.png",
    "Shop": "https://polska-org.pl/gfx/obj/11b.png",
    "Restaurant": "https://polska-org.pl/gfx/obj/08j.png",

    // Infrastructure
    "Bridge": "https://polska-org.pl/gfx/category/500136.png",
    "Petrol station": "https://polska-org.pl/gfx/obj/01a.png",
    "Train station": "https://polska-org.pl/gfx/obj/04a.png",
    "Bus station": "https://polska-org.pl/gfx/obj/02a.png",

    // Culture
    "Cinema": "https://polska-org.pl/gfx/obj/18b.png",
    "Museum": "https://polska-org.pl/gfx/obj/10c.png",

    // Public buildings
    "Police station": "https://polska-org.pl/gfx/obj/08o.png",
    "Fire station": "https://polska-org.pl/gfx/obj/08s.png",
    "Court": "https://polska-org.pl/gfx/obj/08r.png",
    "Post office": "https://polska-org.pl/gfx/obj/08c.png",
    "Town Hall": "https://polska-org.pl/gfx/obj/08t.png",

    // Religious Buildings
    "Church": "https://polska-org.pl/gfx/obj/06a.png",
    "Cemetery": "https://polska-org.pl/gfx/obj/06d.png",

    // Health
    "Care home": "https://polska-org.pl/gfx/obj/08n.png",
    "Hospital": "https://polska-org.pl/gfx/obj/09b.png",
    "Pharmacy": "https://polska-org.pl/gfx/category/500082.png"
};

const addStreetBtn = document.getElementById('addStreetBtn');
const popupOverlay = document.getElementById('popupOverlay');
const cancelStreet = document.getElementById('cancelStreet');
const saveStreet = document.getElementById('saveStreet');
const streetList = document.getElementById('streetList');
const streetSearch = document.getElementById('streetSearch');

let streets = JSON.parse(localStorage.getItem('streets')) || [];
let streetsData = JSON.parse(localStorage.getItem('streetsData')) || {};
let streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};


    function getLeafletIcon(category) {
    const iconUrl = categoryIcons[category] || categoryIcons["Shop"];

    return L.icon({
        iconUrl: iconUrl,
        iconSize: [28, 28],      // good size for these icons
        iconAnchor: [14, 28],    // bottom center touches the map
        popupAnchor: [0, -28]
    });
}function getLeafletIcon(category) {
    const iconUrl = categoryIcons[category] || categoryIcons["Shop"];

    return L.icon({
        iconUrl: iconUrl,
        iconSize: [28, 28],      // good size for these icons
        iconAnchor: [14, 28],    // bottom center touches the map
        popupAnchor: [0, -28]
    });
}

    function getCategoryIcon(category, status, centerAnchor = false) {
    const iconUrl = categoryIcons[category] || categoryIcons['Townhouse'];
    const size = 36;
    const anchor = centerAnchor ? [size/2, size/2] : [size/2, size];

    if (status === "Doesn't exist") {
        return L.divIcon({
            html: `
                <div style="
                    width:${size}px;
                    height:${size}px;
                    border:3px solid rgba(0,0,0,0.6);
                    border-radius:50%;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    background:transparent;">
                    <img src="${iconUrl}" style="width:24px;height:24px;" />
                </div>
            `,
            className: '',
            iconSize: [size, size],
            iconAnchor: anchor,
            popupAnchor: [0, -size/2]
        });
    }

    return L.icon({
        iconUrl,
        iconSize: [32, 32],
        iconAnchor: centerAnchor ? [16, 16] : [16, 32],
        popupAnchor: [0, -16]
    });
}
    
// Cleanup orphan streets
streets = streets.filter(name => streetsData[name]);
localStorage.setItem('streets', JSON.stringify(streets));

function refreshStreetList() {
    streetList.innerHTML = '';
    streets.sort((a,b)=>a.localeCompare(b)).forEach(street=>{
        const li = document.createElement('li');
        li.textContent = street;
        li.addEventListener('click', ()=> {
            // Clicking a street navigates to street.html
            window.location.href = 'street.html?name=' + encodeURIComponent(street);
        });
        streetList.appendChild(li);
    });
}
refreshStreetList();

// Popup handlers
addStreetBtn.addEventListener('click', ()=>popupOverlay.style.display='flex');
cancelStreet.addEventListener('click', ()=>popupOverlay.style.display='none');

saveStreet.addEventListener('click', ()=>{
    const name = document.getElementById('streetName').value.trim();
    const district = document.getElementById('district').value.trim();
    const existing = document.getElementById('existing').checked;
    const description = document.getElementById('description').value.trim();
    if(name!==''){
        streets.push(name);
        localStorage.setItem('streets', JSON.stringify(streets));
        streetsData[name]={ district, existing, description };
        localStorage.setItem('streetsData', JSON.stringify(streetsData));
        refreshStreetList();
    }
    document.getElementById('streetName').value='';
    document.getElementById('district').value='';
    document.getElementById('existing').checked=true;
    document.getElementById('description').value='';
    popupOverlay.style.display='none';
});

// Live search
streetSearch.addEventListener('input', ()=>{
    const query = streetSearch.value.trim().toLowerCase();
    const filtered = streets.filter(name=>name.toLowerCase().includes(query)).sort((a,b)=>a.localeCompare(b));
    streetList.innerHTML='';
    filtered.forEach(street=>{
        const li=document.createElement('li');
        li.textContent=street;
        li.addEventListener('click', ()=>window.location.href='street.html?name='+encodeURIComponent(street));
        streetList.appendChild(li);
    });
});

const map = L.map('map').setView([53.5526,-1.4787],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; OpenStreetMap contributors',
    maxZoom:20
}).addTo(map);

Object.keys(streetObjects).forEach(street => {
    streetObjects[street].forEach(o => {
        if (!o.lat || !o.lng) return;

        const marker = L.marker(
            [o.lat, o.lng],
            { icon: getCategoryIcon(o.category, o.status, true) }
        ).addTo(map);

        let popupContent = `
            <strong>${o.name}</strong><br>
            <em>${street}${o.number ? ' ' + o.number : ''}</em><br>
        `;

        if (o.status && o.status !== 'Exists') {
            popupContent += `<strong>Status:</strong> ${o.status}<br>`;
        }

        if (o.description) {
            popupContent += `<p>${o.description}</p>`;
        }

        popupContent += `
            <button onclick="
                window.location.href='object.html?street=${encodeURIComponent(street)}&object=${encodeURIComponent(o.name)}'
            ">
                View object
            </button>
        `;

        marker.bindPopup(popupContent);
    });
});
</script>
</body>
</html>
