<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Barnsley Streets</title>
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { font-family: Arial; margin:0; padding:0; background:#f5f5f5; }
header { background:#007bff; color:white; padding:15px; display:flex; justify-content:space-between; align-items:center; }
header h1 { margin:0; }
header .auth-buttons button { margin-left:10px; padding:6px 12px; cursor:pointer; }

.section { margin:20px; background:white; padding:15px; border-radius:6px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }

#streetsList li { margin:5px 0; }
#streetsList li button { padding:4px 8px; margin-left:5px; cursor:pointer; }

#homeMap { width:100%; height:500px; margin-top:20px; border-radius:6px; }

.carousel { display:flex; overflow-x:auto; gap:10px; padding:10px 0; }
.carousel img { height:150px; border-radius:4px; }
</style>
</head>

<body>

<header>
  <h1>Barnsley Streets</h1>
  <div class="auth-buttons">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Log In</button>
  </div>
</header>

<!-- Most Viewed Photos Carousel -->
<div class="section">
  <h2>Most Viewed Photos</h2>
  <div class="carousel" id="mostViewedPhotos"></div>
</div>

<!-- Streets List -->
<div class="section">
  <h2>Streets</h2>
  <ul id="streetsList"></ul>
</div>

<!-- Map -->
<div class="section">
  <h2>Map</h2>
  <div id="homeMap"></div>
</div>

<script>
// ---------------- AUTH MOCK ----------------
function signup(){ alert("Sign Up clicked"); }
function login(){ alert("Log In clicked"); }

// ---------------- MOST VIEWED PHOTOS MOCK ----------------
const mostViewedPhotos = [
  "https://picsum.photos/seed/1/300/150",
  "https://picsum.photos/seed/2/300/150",
  "https://picsum.photos/seed/3/300/150",
  "https://picsum.photos/seed/4/300/150"
];
const carousel = document.getElementById("mostViewedPhotos");
mostViewedPhotos.forEach(url=>{
  let img = document.createElement("img");
  img.src = url;
  carousel.appendChild(img);
});

// ---------------- LOAD STREETS ----------------
let streets = JSON.parse(localStorage.getItem("streets")) || [];

// Alphabetical order
streets.sort();

// Render streets list
const streetsListEl = document.getElementById("streetsList");
streets.forEach(street=>{
  let li = document.createElement("li");
  li.innerHTML = `
    ${street} 
    <button onclick="openStreet('${street}')">Open</button>
  `;
  streetsListEl.appendChild(li);
});

// ---------------- OPEN STREET ----------------
function openStreet(streetName){
  localStorage.setItem("currentStreet", streetName);
  window.location.href = "street.html";
}

// ---------------- INIT MAP (LEAFLET) ----------------
const map = L.map('homeMap').setView([53.5526, -1.4820], 13); // Barnsley center

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Add markers for streets with saved locations
streets.forEach(street=>{
  const location = JSON.parse(localStorage.getItem(street + "_location"));
  if(location){
    const marker = L.marker([location.lat, location.lng]).addTo(map)
      .bindPopup(`<b>${street}</b><br><button onclick="openStreetFromMap('${street}')">Open Street</button>`);
  }
});

function openStreetFromMap(streetName){
  localStorage.setItem("currentStreet", streetName);
  window.location.href = "street.html";
}
</script>

</body>
</html>
