<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historical Interactive Map of Barnsley</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #121212;
        color: #eee;
        padding: 0;
    }
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background-color: #1f1f1f;
        color: #eee;
        width: 100%;
        box-sizing: border-box;
    }
    header h1 {
        margin: 0;
        font-size: 24px;
        color: #fff;
    }
    .auth-buttons button {
        margin-left: 10px;
        padding: 5px 10px;
        cursor: pointer;
        background-color: #333;
        color: #eee;
        border: 1px solid #555;
        border-radius: 5px;
    }
    .auth-buttons button:hover {
        background-color: #444;
    }
    section {
        padding: 0 20px;
    }
    h2 {
        margin-top: 30px;
        font-size: 20px;
        color: #fff;
    }
    button {
        cursor: pointer;
        background-color: #333;
        color: #eee;
        border: 1px solid #555;
        border-radius: 5px;
        padding: 5px 10px;
    }
    button:hover {
        background-color: #444;
    }
    #addStreetBtn {
        margin-left: 15px;
    }
    ul#streetList {
        list-style: none;
        padding: 0;
        margin-top: 10px;
    }
    ul#streetList li {
        background: #1f1f1f;
        margin-bottom: 5px;
        padding: 10px;
        border-radius: 5px;
        color: #eee;
        border: 1px solid #333;
        cursor: pointer;
    }
    .popup-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.7);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .popup {
        background: #1f1f1f;
        padding: 25px;
        border-radius: 10px;
        width: 400px;
        max-width: 90%;
        box-sizing: border-box;
        color: #eee;
        border: 1px solid #444;
    }
    .popup h3 {
        text-align: center;
        font-weight: bold;
        margin-top: 0;
        color: #fff;
    }
    .popup label {
        display: block;
        margin-top: 10px;
    }
    .popup input[type="text"],
    .popup textarea,
    .popup select {
        width: 100%;
        padding: 5px;
        margin-top: 5px;
        box-sizing: border-box;
        background-color: #2b2b2b;
        color: #eee;
        border: 1px solid #555;
        border-radius: 5px;
    }
    .popup input[type="checkbox"] {
        transform: scale(1.2);
        margin-right: 5px;
    }
    .popup-buttons {
        margin-top: 15px;
        display: flex;
        justify-content: space-between;
    }
    #map {
        height: 600px;
        margin-top: 20px;
        border-radius: 10px;
        border: 1px solid #333;
    }
</style>
</head>
<body>

<header>
    <h1>Historical Interactive Map of Barnsley</h1>
    <div class="auth-buttons">
        <button>Sign Up</button>
        <button>Log In</button>
    </div>
</header>

<section>
<h2 style="display: flex; align-items: center; gap: 10px;">
    <span>Streets</span>
    <button id="addStreetBtn">Add Street</button>
    <input type="text" id="streetSearch" placeholder="Search streets..." style="flex:1; padding:5px; border-radius:5px; border:1px solid #555; background-color:#2b2b2b; color:#eee;">
</h2>
    <ul id="streetList"></ul>
</section>

<div class="popup-overlay" id="popupOverlay">
    <div class="popup">
        <h3 id="popupTitle">Add Street</h3>
        <label for="streetName">Street Name:</label>
        <input type="text" id="streetName">

        <label for="district">District:</label>
        <select id="district">
            <option value="Town Centre">Town Centre</option>
        </select>

        <label>Status:</label>
        <select id="status">
            <option value="Exists" selected>Exists</option>
            <option value="Doesn't exist">Doesn't exist</option>
            <option value="To be demolished">To be demolished</option>
        </select>

        <label for="description">Description:</label>
        <textarea id="description" rows="3"></textarea>

        <div class="popup-buttons">
            <button id="saveStreet">Save</button>
            <button id="cancelStreet">Cancel</button>
        </div>
    </div>
</div>

<section>
    <h2>Map</h2>
    <div id="map"></div>
</section>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const addStreetBtn = document.getElementById('addStreetBtn');
const popupOverlay = document.getElementById('popupOverlay');
const cancelStreet = document.getElementById('cancelStreet');
const saveStreet = document.getElementById('saveStreet');
const streetList = document.getElementById('streetList');
const streetSearch = document.getElementById('streetSearch');
const popupTitle = document.getElementById('popupTitle');

let streets = JSON.parse(localStorage.getItem('streets')) || [];
let streetsData = JSON.parse(localStorage.getItem('streetsData')) || {};

// CLEANUP ORPHAN STREETS
streets = streets.filter(name => streetsData[name]);
localStorage.setItem('streets', JSON.stringify(streets));

// Refresh list
function refreshStreetList() {
    streetList.innerHTML = '';
    streets.sort((a,b) => a.localeCompare(b));
    streets.forEach(street => {
        const li = document.createElement('li');
        li.textContent = street;
        li.addEventListener('click', () => editStreet(street));
        streetList.appendChild(li);
    });
}

// Open popup for editing or adding
function editStreet(street=null) {
    popupOverlay.style.display = 'flex';
    if(street) {
        popupTitle.textContent = 'Edit Street';
        document.getElementById('streetName').value = street;
        const data = streetsData[street];
        document.getElementById('district').value = data.district || '';
        document.getElementById('status').value = data.existing || 'Exists';
        document.getElementById('description').value = data.description || '';
        saveStreet.dataset.editing = street;
    } else {
        popupTitle.textContent = 'Add Street';
        document.getElementById('streetName').value = '';
        document.getElementById('district').value = '';
        document.getElementById('status').value = 'Exists';
        document.getElementById('description').value = '';
        delete saveStreet.dataset.editing;
    }
}

addStreetBtn.addEventListener('click', () => editStreet());
cancelStreet.addEventListener('click', () => popupOverlay.style.display = 'none');

saveStreet.addEventListener('click', () => {
    const name = document.getElementById('streetName').value.trim();
    const district = document.getElementById('district').value.trim();
    const existing = document.getElementById('status').value;
    const description = document.getElementById('description').value.trim();
    if(!name) return;

    // If editing, remove old key if name changed
    const editing = saveStreet.dataset.editing;
    if(editing && editing !== name) {
        delete streetsData[editing];
        streets = streets.filter(s => s !== editing);
    }

    if(!streets.includes(name)) streets.push(name);
    streetsData[name] = { district, existing, description };
    localStorage.setItem('streets', JSON.stringify(streets));
    localStorage.setItem('streetsData', JSON.stringify(streetsData));
    refreshStreetList();
    popupOverlay.style.display = 'none';
});

// LIVE SEARCH
streetSearch.addEventListener('input', () => {
    const query = streetSearch.value.trim().toLowerCase();
    const filtered = streets.filter(s => s.toLowerCase().includes(query)).sort((a,b) => a.localeCompare(b));
    streetList.innerHTML = '';
    filtered.forEach(street => {
        const li = document.createElement('li');
        li.textContent = street;
        li.addEventListener('click', () => editStreet(street));
        streetList.appendChild(li);
    });
});

refreshStreetList();

// --- Map ---
const map = L.map('map').setView([53.5526, -1.4787], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 20
}).addTo(map);
</script>
</body>
</html>
