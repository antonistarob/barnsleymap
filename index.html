<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Barnsley Historic Photos</title>

  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.29/"></script>

  <style>
    html, body, #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: white;
      padding: 10px;
      z-index: 99;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    #viewDiv {
      margin-top: 60px;
      height: calc(100% - 60px);
    }
  </style>
</head>

<body>

<header>
  <h1>Barnsley Historic Photos Map</h1>
</header>

<div id="viewDiv"></div>

<script>
require([
  "esri/config",
  "esri/Map",
  "esri/views/MapView",
  "esri/Graphic",
  "esri/layers/GraphicsLayer"
], function(esriConfig, Map, MapView, Graphic, GraphicsLayer) {

  esriConfig.apiKey = "AAPTxy8BH1VEsoebNVZXo8HurF9ISRTrAh1OrRfmL2PhQzmZtXOAqDthSV6k7MMV3d9A0I8Yzm8893mWylV-AAzjHW8Vdje5nHbcCoWP8oTym3uv8avVcv3Vo0378-pNaQV4lBazkO4PICEb7s0wAYVjvz431sxHmWEOmvQBV_CFHX8jVjCLIgSL9VflJACm47m1x6ZEzK3oOJxg3TmVwHL4Qy_o8flbD_c7ThfAebykl1o.AT1_J9TBjsr2";

  const map = new Map({
    basemap: "arcgis-light-gray"
  });

  const view = new MapView({
    container: "viewDiv",
    map: map,
    center: [-1.4820, 53.5526], // Barnsley
    zoom: 14
  });

  const graphicsLayer = new GraphicsLayer();
  map.add(graphicsLayer);

  const point = {
    type: "point",
    longitude: -1.4820,
    latitude: 53.5526
  };

  const popupTemplate = {
    title: "Barnsley Town Centre - Example",
    content: "This is your first historic photo marker."
  };

  const markerSymbol = {
    type: "simple-marker",
    color: "red",
    outline: {
      color: "white",
      width: 1
    }
  };

  const pointGraphic = new Graphic({
    geometry: point,
    symbol: markerSymbol,
    popupTemplate: popupTemplate
  });

  graphicsLayer.add(pointGraphic);
});
</script>

</body>
</html>
