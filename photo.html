<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo View</title>
<style>
body { font-family: Arial; background:#121212; color:#eee; margin:0; padding:20px; }
.photo-card { max-width:800px; margin:auto; background:#1f1f1f; padding:15px; border-radius:6px; }
.photo-card img { max-width:100%; border-radius:6px; display:block; margin-bottom:10px; }
.photo-info div { margin-bottom:5px; }
.photo-controls { display:flex; justify-content:flex-end; gap:10px; margin-bottom:10px; }
.photo-action-btn { background:#3498db; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; }
.photo-action-btn.delete { background:#c0392b; }
.popup-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:999; }
.popup { background:#2c2c2c; padding:20px; border-radius:8px; width:400px; max-width:90%; }
.popup textarea, .popup input { width:100%; margin-top:5px; margin-bottom:10px; padding:5px; background:#1f1f1f; color:#eee; border:1px solid #555; border-radius:4px; }
.popup-buttons { display:flex; justify-content:flex-end; gap:10px; }
</style>
</head>
<body>

<div id="photoContainer"></div>

<!-- EDIT PHOTO POPUP (copy from object.html "Add Photo") -->
<div class="popup-overlay" id="editPhotoModal">
    <div class="popup">
        <h3>Edit Photo</h3>
        <label for="editPhotoDate">Date:</label>
        <input type="text" id="editPhotoDate" placeholder="DD/MM/YYYY">

        <label for="editPhotoDescription">Description:</label>
        <textarea id="editPhotoDescription" rows="3"></textarea>

        <div class="popup-buttons">
            <button onclick="savePhotoEdits()" class="photo-action-btn">Save</button>
            <button onclick="closeEditModal()" class="photo-action-btn">Cancel</button>
        </div>
    </div>
</div>

<!-- DELETE PHOTO POPUP -->
<div class="popup-overlay" id="deletePhotoPopup">
    <div class="popup">
        <h3>Delete Photo?</h3>
        <div>Are you sure you want to delete this photo?</div>
        <div class="popup-buttons">
            <button id="confirmDeletePhoto" class="photo-action-btn delete">Delete</button>
            <button id="cancelDeletePhoto" class="photo-action-btn">Cancel</button>
        </div>
    </div>
</div>

<script>
// --- HELPERS ---
function getQueryParam(p) {
    return new URLSearchParams(location.search).get(p);
}
function formatDateGB(dateValue) {
    if (!dateValue) return "";
    const d = new Date(dateValue);
    if (isNaN(d)) return dateValue;
    return d.toLocaleDateString('en-GB');
}

// --- LOAD URL PARAMS ---
const streetName = getQueryParam('street');
const objectName = getQueryParam('object');
const photoId = getQueryParam('photoId');

const streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
const obj = (streetObjects[streetName] || []).find(o => o.name === objectName);

const container = document.getElementById('photoContainer');

// --- GET PHOTO ---
let photo = null;
if (obj && obj.photos) {
    photo = obj.photos.find(p => p.id === photoId);
}
if (!photo) {
    photo = { id:'missing_' + Date.now(), description:'Photo missing', username:'Unknown', views:0 };
}

photo.username ||= "Anonymous";
photo.views ||= 0;
photo.views++;
if (obj && obj.photos && photo) {
    localStorage.setItem('streetObjects', JSON.stringify(streetObjects));
}

// --- CREATE PHOTO CARD ---
const card = document.createElement('div');
card.className = 'photo-card';

// CONTROLS
const controls = document.createElement('div');
controls.className = 'photo-controls';

const editBtn = document.createElement('button');
editBtn.textContent = 'Edit';
editBtn.className = 'photo-action-btn';
editBtn.onclick = () => openEditPhoto(photo);
controls.appendChild(editBtn);

const deleteBtn = document.createElement('button');
deleteBtn.textContent = 'Delete';
deleteBtn.className = 'photo-action-btn delete';
deleteBtn.onclick = () => openDeletePhoto(photo.id);
controls.appendChild(deleteBtn);

card.appendChild(controls);

// IMAGE
const img = document.createElement('img');
img.src = photo.dataUrl || photo.src || 'placeholder.png';
img.alt = photo.description || '';
card.appendChild(img);

// INFO
const info = document.createElement('div');
info.className = 'photo-info';
if (photo.description) info.innerHTML += `<div><strong>Description:</strong> ${photo.description}</div>`;
if (photo.date) info.innerHTML += `<div><strong>Date of photo:</strong> ${formatDateGB(photo.date)}</div>`;
const addedDate = photo.id.includes('_') ? new Date(parseInt(photo.id.split('_')[1] || Date.now())) : new Date();
info.innerHTML += `<div><strong>Date added:</strong> ${addedDate.toLocaleDateString('en-GB')}</div>`;
info.innerHTML += `<div><strong>Added by:</strong> ${photo.username}</div>`;
info.innerHTML += `<div><strong>Views:</strong> ${photo.views}</div>`;
info.innerHTML += `<div><strong>Directory:</strong> <a href="street.html?name=${encodeURIComponent(streetName)}">${streetName}</a> &gt; <a href="object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(objectName)}">${objectName}</a></div>`;
card.appendChild(info);

container.appendChild(card);

// --- EDIT PHOTO ---
let editingPhoto = null;
function openEditPhoto(photo) {
    editingPhoto = photo;
    document.getElementById('editPhotoDescription').value = photo.description || "";
    document.getElementById('editPhotoDate').value = photo.date ? formatDateGB(photo.date) : "";
    document.getElementById('editPhotoModal').style.display = 'flex';
}
function closeEditModal() {
    editingPhoto = null;
    document.getElementById('editPhotoModal').style.display = 'none';
}
function savePhotoEdits() {
    if (!editingPhoto) return;
    const desc = document.getElementById('editPhotoDescription').value.trim();
    const dateStr = document.getElementById('editPhotoDate').value.trim();
    editingPhoto.description = desc;
    if (dateStr) editingPhoto.date = new Date(dateStr.split('/').reverse().join('-')).toISOString();
    localStorage.setItem('streetObjects', JSON.stringify(streetObjects));
    location.reload();
}

// --- OPEN DELETE ---
function openDeletePhoto(id) {
    photoToDelete = id; // ensure this is the exact photo.id
    document.getElementById('deletePhotoPopup').style.display = 'flex';
}

// --- CLOSE DELETE ---
function closeDeletePhotoPopup() {
    photoToDelete = null;
    document.getElementById('deletePhotoPopup').style.display = 'none';
}
document.getElementById('cancelDeletePhoto').addEventListener('click', closeDeletePhotoPopup);

// --- CONFIRM DELETE ---
document.getElementById('confirmDeletePhoto').addEventListener('click', () => {
    if (!photoToDelete) return;

    // Ensure we have the object
    const objArray = streetObjects[streetName] || [];
    const obj = objArray.find(o => o.name === objectName);
    if (!obj || !Array.isArray(obj.photos)) return;

    // Delete the photo
    const initialCount = obj.photos.length;
    obj.photos = obj.photos.filter(p => p.id !== photoToDelete);
    
    // Save back
    streetObjects[streetName] = objArray;
    localStorage.setItem('streetObjects', JSON.stringify(streetObjects));

    // Close popup and redirect
    closeDeletePhotoPopup();
    window.location.href = `object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(objectName)}`;
});
</script>

</body>
</html>
