<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Viewer</title>

<style>
body {
    background: #121212;
    color: #eee;
    font-family: Arial;
    margin: 0;
    padding: 20px;
}

a { color: #88c; text-decoration: none; }
a:hover { text-decoration: underline; }

h1 {
    text-align: center;
    margin-bottom: 20px;
}

#photoContainer {
    display: flex;
    justify-content: center;
}

.photo-card {
    background: #1f1f1f;
    border: 1px solid #555;
    border-radius: 5px;
    max-width: 1000px;
    width: 100%;
    position: relative;
}

.photo-card img {
    width: 100%;
    display: block;
    border-radius: 5px 5px 0 0;
}

.photo-info {
    margin-top: 8px;
    background: #2b2b2b;
    padding: 8px;
    border-radius: 5px;
    font-size: 13px;
    color: #ccc;
}

.photo-info div {
    margin-bottom: 4px;
}

/* EDIT / DELETE */
.photo-controls {
    position: absolute;
    top: 10px;
    left: 10px;
    display: flex;
    gap: 8px;
    z-index: 5;
}

.photo-action-btn {
    background: rgba(30,30,30,0.9);
    color: #eee;
    border: 1px solid #555;
    padding: 4px 8px;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
}

.photo-action-btn:hover {
    background: #444;
}

.photo-action-btn.delete {
    border-color: #922b21;
    color: #e74c3c;
}
</style>
</head>

<body>

<h1>Photo Viewer</h1>
<div id="photoContainer"></div>

<script>
function getQueryParam(p) {
    return new URLSearchParams(location.search).get(p);
}

function formatDateGB(dateValue) {
    if (!dateValue) return "";
    const d = new Date(dateValue);
    if (isNaN(d)) return dateValue; // fallback
    return d.toLocaleDateString('en-GB');
}

const streetName = getQueryParam('street');
const objectName = getQueryParam('object');
const photoId = getQueryParam('photo');

const streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
const obj = (streetObjects[streetName] || []).find(o => o.name === objectName);
const container = document.getElementById('photoContainer');

if (!obj || !obj.photos) {
    container.innerHTML = '<p style="color:#aaa;">Photo not found.</p>';
} else {
    const photo = obj.photos.find(p => p.id === photoId);

    if (!photo) {
        container.innerHTML = '<p style="color:#aaa;">Photo not found.</p>';
    } else {
        /* defaults */
        photo.username ||= "Anonymous";
        photo.views ||= 0;

        /* increment views */
        photo.views++;
        localStorage.setItem('streetObjects', JSON.stringify(streetObjects));

        const card = document.createElement('div');
        card.className = 'photo-card';

        /* CONTROLS */
        const controls = document.createElement('div');
        controls.className = 'photo-controls';

        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit';
        editBtn.className = 'photo-action-btn';
        editBtn.onclick = () => editPhoto(photo);
        controls.appendChild(editBtn);

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.className = 'photo-action-btn delete';
        deleteBtn.onclick = () => deletePhoto(photo.id);
        controls.appendChild(deleteBtn);

        card.appendChild(controls);

        /* IMAGE (NOT CLICKABLE) */
        const img = document.createElement('img');
        img.src = photo.dataUrl || photo.src;
        img.alt = photo.description || '';
        card.appendChild(img);

        /* INFO */
        const info = document.createElement('div');
        info.className = 'photo-info';

        if (photo.description) {
            info.innerHTML += `<div><strong>Description:</strong> ${photo.description}</div>`;
        }

        if (photo.date) {
            info.innerHTML += `<div><strong>Date of photo:</strong> ${formatDateGB(photo.date)}</div>`;
        }

        const addedDate = new Date(parseInt(photo.id.split('_')[0]));
        info.innerHTML += `<div><strong>Date added:</strong> ${addedDate.toLocaleDateString('en-GB')}</div>`;

        info.innerHTML += `<div><strong>Added by:</strong> ${photo.username}</div>`;
        info.innerHTML += `<div><strong>Views:</strong> ${photo.views}</div>`;

        info.innerHTML += `
            <div>
                <strong>Directory:</strong>
                <a href="street.html?name=${encodeURIComponent(streetName)}">${streetName}</a> &gt;
                <a href="object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(objectName)}">${objectName}</a>
            </div>
        `;

        card.appendChild(info);
        container.appendChild(card);
    }
}

function editPhoto(photo) {
    const newDesc = prompt("Edit description:", photo.description || "");
    if (newDesc === null) return;

    const newDate = prompt(
        "Edit photo date (DD/MM/YYYY):",
        formatDateGB(photo.date)
    );
    if (newDate === null) return;

    /* convert DD/MM/YYYY → ISO */
    const [d, m, y] = newDate.split('/');
    if (!d || !m || !y) {
        alert("Invalid date format.");
        return;
    }

    photo.description = newDesc.trim();
    photo.date = new Date(`${y}-${m}-${d}`).toISOString();

    localStorage.setItem('streetObjects', JSON.stringify(streetObjects));
    location.reload();
}

function deletePhoto(photoId) {
    if (!confirm("Delete this photo permanently?")) return;

    obj.photos = obj.photos.filter(p => p.id !== photoId);
    localStorage.setItem('streetObjects', JSON.stringify(streetObjects));

    window.location.href =
        `object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(objectName)}`;
}
</script>

</body>
</html>
