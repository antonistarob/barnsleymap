<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Viewer</title>

<style>
body {
    background: #121212;
    color: #eee;
    font-family: Arial;
    margin: 0;
    padding: 20px;
}

a { color: #88c; text-decoration: none; }
a:hover { text-decoration: underline; }

h1 {
    text-align: center;
    margin-bottom: 20px;
}

#photoContainer {
    display: flex;
    justify-content: center;
}

.photo-card {
    background: #1f1f1f;
    border: 1px solid #555;
    border-radius: 5px;
    max-width: 1000px;
    width: 100%;
    position: relative;
}

.photo-card img {
    width: 100%;
    display: block;
    border-radius: 5px 5px 0 0;
}

.photo-info {
    margin-top: 8px;
    background: #2b2b2b;
    padding: 8px 12px;
    border-radius: 5px;
    font-size: 13px;
    color: #ccc;
}

.photo-info div {
    margin-bottom: 4px;
}

/* EDIT / DELETE */
.photo-controls {
    position: absolute;
    top: 10px;
    left: 10px;
    display: flex;
    gap: 8px;
    z-index: 5;
}

.photo-action-btn {
    background: rgba(30,30,30,0.9);
    color: #eee;
    border: 1px solid #555;
    padding: 4px 8px;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
}

.photo-action-btn:hover {
    background: #444;
}

.photo-action-btn.delete {
    border-color: #922b21;
    color: #e74c3c;
}

/* MODAL */
.modal-overlay, .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
}

.modal, .popup {
    background: #1f1f1f;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 15px;
    width: 320px;
    color: #eee;
}

.modal h2 {
    margin: 0 0 12px;
    font-size: 18px;
}

.modal label {
    font-size: 13px;
    color: #bbb;
}

.modal input,
.modal textarea {
    width: 100%;
    margin-top: 4px;
    margin-bottom: 10px;
    padding: 6px 8px;
    background: #2b2b2b;
    border: 1px solid #555;
    border-radius: 4px;
    box-sizing: border-box;
    color: #eee;
    font-family: Arial;
    font-size: 13px;
}

.modal textarea {
    resize: vertical;
    min-height: 60px;
}

.modal-actions, .popup-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.modal-btn, .action-button {
    padding: 5px 10px;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid #555;
    background: #2b2b2b;
    color: #eee;
}

.modal-btn:hover, .action-button:hover {
    background: #444;
}

.modal-btn.save {
    border-color: #3c6;
    color: #9f9;
}

.action-button.delete {
    border-color: #922b21;
    color: #e74c3c;
}
</style>
</head>

<body>

<h1>Photo Viewer</h1>
<div id="photoContainer"></div>

<!-- EDIT PHOTO MODAL -->
<div class="modal-overlay" id="editPhotoModal">
    <div class="modal">
        <h2>Edit Photo</h2>

        <label>Date of photo (DD/MM/YYYY)</label>
        <input type="text" id="editPhotoDate" placeholder="DD/MM/YYYY">

        <label>Description</label>
        <textarea id="editPhotoDescription"></textarea>

        <div class="modal-actions">
            <button class="modal-btn" onclick="closeEditModal()">Cancel</button>
            <button class="modal-btn save" onclick="savePhotoEdits()">Save</button>
        </div>
    </div>
</div>

<!-- DELETE PHOTO POPUP -->
<div class="popup-overlay" id="deletePhotoPopup">
    <div class="popup">
        <p id="deletePhotoMessage">Are you sure you want to delete this photo?</p>
        <div class="popup-buttons">
            <button id="confirmDeletePhoto" class="action-button delete">Yes</button>
            <button id="cancelDeletePhoto" class="action-button">No</button>
        </div>
    </div>
</div>

<script>
function getQueryParam(p) {
    return new URLSearchParams(location.search).get(p);
}

function formatDateGB(dateValue) {
    if (!dateValue) return "";
    const d = new Date(dateValue);
    if (isNaN(d)) return dateValue;
    return d.toLocaleDateString('en-GB');
}

const streetName = getQueryParam('street');
const objectName = getQueryParam('object');
const photoId = getQueryParam('photoId'); // keep as string

const streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
const obj = (streetObjects[streetName] || []).find(o => o.name === objectName);
const container = document.getElementById('photoContainer');

if (!obj || !obj.photos) {
    container.innerHTML = '<p style="color:#aaa;">Photo not found.</p>';
} else {
    const photo = obj.photos.find(p => p.id === photoId);

    if (!photo) {
        container.innerHTML = '<p style="color:#aaa;">Photo not found.</p>';
    } else {
        photo.username ||= "Anonymous";
        photo.views ||= 0;
        photo.views++;
        localStorage.setItem('streetObjects', JSON.stringify(streetObjects));

        const card = document.createElement('div');
        card.className = 'photo-card';

        // CONTROLS
        const controls = document.createElement('div');
        controls.className = 'photo-controls';

        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit';
        editBtn.className = 'photo-action-btn';
        editBtn.onclick = () => openEditPhoto(photo);
        controls.appendChild(editBtn);

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.className = 'photo-action-btn delete';
        deleteBtn.onclick = () => openDeletePhoto(photo.id);
        controls.appendChild(deleteBtn);

        card.appendChild(controls);

        // IMAGE
        const img = document.createElement('img');
        img.src = photo.dataUrl || photo.src;
        img.alt = photo.description || '';
        card.appendChild(img);

        // INFO
        const info = document.createElement('div');
        info.className = 'photo-info';

        if (photo.description) info.innerHTML += `<div><strong>Description:</strong> ${photo.description}</div>`;
        if (photo.date) info.innerHTML += `<div><strong>Date of photo:</strong> ${formatDateGB(photo.date)}</div>`;
        const addedDate = new Date(parseInt(photo.id.split('_')[0]));
        info.innerHTML += `<div><strong>Date added:</strong> ${addedDate.toLocaleDateString('en-GB')}</div>`;
        info.innerHTML += `<div><strong>Added by:</strong> ${photo.username}</div>`;
        info.innerHTML += `<div><strong>Views:</strong> ${photo.views}</div>`;
        info.innerHTML += `
        <div>
            <strong>Directory:</strong>
            <a href="street.html?name=${encodeURIComponent(streetName)}">${streetName}</a> &gt;
            <a href="object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(objectName)}">${objectName}</a>
        </div>`;

        card.appendChild(info);
        container.appendChild(card);
    }
}

// EDIT MODAL
let editingPhoto = null;
function openEditPhoto(photo) {
    editingPhoto = photo;
    document.getElementById('editPhotoDescription').value = photo.description || "";
    document.getElementById('editPhotoDate').value = formatDateGB(photo.date);
    document.getElementById('editPhotoModal').style.display = 'flex';
}
function closeEditModal() {
    editingPhoto = null;
    document.getElementById('editPhotoModal').style.display = 'none';
}
function savePhotoEdits() {
    if (!editingPhoto) return;
    const desc = document.getElementById('editPhotoDescription').value.trim();
    const dateStr = document.getElementById('editPhotoDate').value.trim();
    const [d, m, y] = dateStr.split('/');
    if (!d || !m || !y) { alert("Date must be DD/MM/YYYY"); return; }
    const isoDate = new Date(`${y}-${m}-${d}`);
    if (isNaN(isoDate)) { alert("Invalid date"); return; }
    editingPhoto.description = desc;
    editingPhoto.date = isoDate.toISOString();
    localStorage.setItem('streetObjects', JSON.stringify(streetObjects));
    location.reload();
}

// DELETE MODAL
let photoToDelete = null;
function openDeletePhoto(id) {
    photoToDelete = id;
    document.getElementById('deletePhotoPopup').style.display = 'flex';
}
function closeDeletePhotoPopup() {
    photoToDelete = null;
    document.getElementById('deletePhotoPopup').style.display = 'none';
}

document.getElementById('cancelDeletePhoto').addEventListener('click', closeDeletePhotoPopup);
document.getElementById('confirmDeletePhoto').addEventListener('click', () => {
    if (!photoToDelete) return;
    let streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
    const obj = (streetObjects[streetName] || []).find(o => o.name === objectName);
    if (!obj || !obj.photos) return;
    obj.photos = obj.photos.filter(p => p.id !== photoToDelete);
    localStorage.setItem('streetObjects', JSON.stringify(streetObjects));
    window.location.href = `object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(objectName)}`;
});
</script>

</body>
</html>
