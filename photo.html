<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Viewer</title>
<style>
    body {
        background: #121212;
        color: #eee;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }
    a { color: #88c; text-decoration: none; }
    a:hover { text-decoration: underline; }

    h1 { text-align: center; margin-bottom: 20px; }

    #photoContainer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
    }

    .photo-card {
        background: #1f1f1f;
        border: 1px solid #555;
        border-radius: 5px;
        width: 220px;
        padding: 10px;
        text-align: center;
    }

    .photo-card img {
        width: 200px;
        border-radius: 5px;
        cursor: pointer;
    }

    .photo-info {
        margin-top: 8px;
        background: #2b2b2b;
        padding: 5px;
        border-radius: 5px;
        font-size: 12px;
        text-align: left;
        color: #ccc;
    }

    .photo-info div { margin-bottom: 3px; }
</style>
</head>
<body>

<h1>Photos for Object</h1>
<div id="photoContainer"></div>

<script>
    // Example data: in real use, pull from localStorage or query params
    const streetName = "Peel Street 2";
    const objectName = "Holden House";

    // Sample photo array
    let objPhotos = JSON.parse(localStorage.getItem('streetObjects'))?.[streetName]?.find(o => o.name === objectName)?.photos || [];

    const container = document.getElementById('photoContainer');

    if(!objPhotos || objPhotos.length === 0){
        container.innerHTML = '<p style="color:#aaa;">No photos added yet.</p>';
    }

    objPhotos.forEach(photo => {
        const card = document.createElement('div');
        card.className = 'photo-card';

        const img = document.createElement('img');
        img.src = photo.dataUrl || photo.src;
        img.alt = photo.description || '';
        img.onclick = () => {
            // Open photo in new tab
            const win = window.open();
            win.document.write(`<img src="${img.src}" style="max-width:100%; display:block; margin:auto;">`);
        };
        card.appendChild(img);

        const info = document.createElement('div');
        info.className = 'photo-info';

        if(photo.description) info.innerHTML += `<div><strong>Description:</strong> ${photo.description}</div>`;
        if(photo.date) info.innerHTML += `<div><strong>Date of photo:</strong> ${photo.date}</div>`;
        if(photo.id){
            const dateAdded = new Date(parseInt(photo.id.split('_')[0]));
            info.innerHTML += `<div><strong>Date added:</strong> ${dateAdded.toLocaleDateString()}</div>`;
        }
        if(photo.username) info.innerHTML += `<div><strong>Added by:</strong> ${photo.username}</div>`;
        if(photo.views !== undefined) info.innerHTML += `<div><strong>Views:</strong> ${photo.views}</div>`;

        // Directory links
        info.innerHTML += `<div><strong>Directory:</strong> 
            <a href="street.html?name=${encodeURIComponent(streetName)}">${streetName}</a> &gt; 
            <a href="object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(objectName)}">${objectName}</a>
        </div>`;

        card.appendChild(info);
        container.appendChild(card);
    });
</script>

</body>
</html>
