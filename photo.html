<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo View</title>
<style>
    body {
        font-family: Arial;
        background: #121212;
        color: #eee;
        margin: 0;
        padding: 20px;
        text-align: center;
    }
    header {
        background: #1f1f1f;
        padding: 15px 20px;
        position: sticky;
        top: 0;
        border-bottom: 1px solid #333;
    }
    header a {
        color: #fff;
        text-decoration: none;
        font-size: 20px;
    }
    header a:hover {
        text-decoration: underline;
    }
    .photo-card {
        background: #1f1f1f;
        border: 1px solid #555;
        border-radius: 8px;
        padding: 20px;
        max-width: 700px;
        margin: 30px auto;
        text-align: center;
    }
    .photo-card img {
        max-width: 100%;
        height: auto;
        border-radius: 6px;
    }
    .photo-info {
        margin-top: 15px;
        text-align: left;
    }
    .photo-info p {
        margin: 5px 0;
    }
    .back-link {
        display: inline-block;
        margin-top: 20px;
        color: #aaa;
        text-decoration: none;
        font-size: 14px;
    }
    .back-link:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<header>
    <a href="index.html">Historical Interactive Map of Barnsley</a>
</header>

<div id="photoContainer" class="photo-card">
    <h2 id="photoTitle"></h2>
    <img id="photoImage" src="" alt="Photo">
    <div class="photo-info">
        <p id="photoDescription"></p>
        <p id="photoDate"></p>
        <p id="photoSource"></p>
    </div>
    <a href="#" class="back-link" id="backToObject">← Back to object</a>
</div>

<script>
const qp = p => new URLSearchParams(location.search).get(p);
const streetName = qp('street');
const objectName = qp('object');
const photoId = qp('photoId');

const streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
const objArray = streetObjects[streetName] || [];
const obj = objArray.find(o => o.name === objectName);
if (!obj) {
    document.getElementById('photoContainer').innerHTML = '<h2 style="color:#c0392b;">Object not found</h2>';
    throw new Error("Object not found");
}

const photo = obj.photos.find(p => p.id === photoId);
if (!photo) {
    document.getElementById('photoContainer').innerHTML = '<h2 style="color:#c0392b;">Photo not found</h2>';
    throw new Error("Photo not found");
}

// Image
const img = document.createElement('img');
img.src = photo.url || 'placeholder.png';
img.alt = photo.description || 'Photo';
card.appendChild(img);

document.getElementById('photoDescription').textContent = photo.description ? `Description: ${photo.description}` : '';
document.getElementById('photoDate').textContent = photo.date ? `Date: ${photo.date}` : '';
document.getElementById('photoSource').textContent = photo.source ? `Source: ${photo.source}` : '';

// Back link
document.getElementById('backToObject').href = `object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(objectName)}`;
</script>

</body>
</html>
