<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Viewer</title>
<style>
body { background: #121212; color: #eee; font-family: Arial; margin: 10; padding: 20px; }
a { color: #88c; text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { text-align: center; margin-bottom: 20px; }
#photoContainer { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
.photo-card { background: #1f1f1f; border: 1px solid #555; border-radius: 5px; padding: 0px; text-align: center; max-width: 1000px; }
.photo-card img { width: 100%; border-radius: 5px; cursor: pointer; }
.photo-info { margin-top: 8px; background: #2b2b2b; padding: 8px; border-radius: 5px; font-size: 13px; text-align: left; color: #ccc; }
.photo-info div { margin-bottom: 3px; }
</style>
</head>
<body>

<h1>Photo Viewer</h1>
<div id="photoContainer"></div>

<script>
function getQueryParam(p) {
    return new URLSearchParams(location.search).get(p);
}

const streetName = getQueryParam('street');
const objectName = getQueryParam('object');
const photoId = getQueryParam('photo');

const streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
const obj = (streetObjects[streetName] || []).find(o => o.name === objectName);
const container = document.getElementById('photoContainer');

if (!obj || !obj.photos || obj.photos.length === 0) {
    container.innerHTML = '<p style="color:#aaa;">No photos found.</p>';
} else {
    const photo = obj.photos.find(p => p.id === photoId);

    if (!photo) {
        container.innerHTML = '<p style="color:#aaa;">Photo not found.</p>';
    } else {
        // defaults (safety)
        if (!photo.username) photo.username = "Anonymous";
        if (!photo.views) photo.views = 0;

        // increment views
        photo.views++;
        localStorage.setItem('streetObjects', JSON.stringify(streetObjects));

        const card = document.createElement('div');
        card.className = 'photo-card';

        /* IMAGE (NOT CLICKABLE) */
        const img = document.createElement('img');
        img.src = photo.dataUrl || photo.src;
        img.alt = photo.description || '';
        card.appendChild(img);

        /* INFO BOX */
        const info = document.createElement('div');
        info.className = 'photo-info';

        if (photo.description) {
            info.innerHTML += `<div><strong>Description:</strong> ${photo.description}</div>`;
        }

        if (photo.date) {
            const photoDate = new Date(photo.date);
            const formattedPhotoDate = photoDate.toLocaleDateString('en-GB');
            info.innerHTML += `<div><strong>Date of photo:</strong> ${formattedPhotoDate}</div>`;
        }

        if (photo.id) {
            const addedDate = new Date(parseInt(photo.id.split('_')[0]));
            info.innerHTML += `<div><strong>Date added:</strong> ${addedDate.toLocaleDateString()}</div>`;
        }

        info.innerHTML += `<div><strong>Added by:</strong> ${photo.username}</div>`;
        info.innerHTML += `<div><strong>Views:</strong> ${photo.views}</div>`;

        /* DIRECTORY */
        info.innerHTML += `
            <div>
                <strong>Directory:</strong>
                <a href="street.html?name=${encodeURIComponent(streetName)}">${streetName}</a> &gt;
                <a href="object.html?street=${encodeURIComponent(streetName)}&object=${encodeURIComponent(objectName)}">${objectName}</a>
            </div>
        `;

        card.appendChild(info);
        container.appendChild(card);
    }
}
</script>

</body>
</html>
