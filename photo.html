<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Viewer</title>
<style>
    body { background:#121212; color:#eee; font-family:Arial; text-align:center; margin:0; padding:20px;}
    img { max-width:90%; max-height:70vh; border-radius:5px; }
    .info-box { margin-top:15px; background:#1f1f1f; padding:10px; border-radius:5px; display:inline-block; text-align:left; }
</style>
</head>
<body>
<h1>Photo Viewer</h1>
<div id="photoContainer">
    <img id="photoImg" src="" alt="Photo">
    <div class="info-box">
        <div id="photoDate"></div>
        <div id="photoDesc"></div>
    </div>
</div>

<script>
const qp = p => new URLSearchParams(location.search).get(p);
const street = qp('street');
const objectName = qp('object');
const photoId = qp('photoId');

if(!street || !objectName || !photoId){
    document.body.innerHTML = '<p>No photo data provided.</p>';
} else {
    const streetObjects = JSON.parse(localStorage.getItem('streetObjects')) || {};
    const obj = (streetObjects[street] || []).find(o => o.name === objectName);
    if(!obj || !obj.photos) {
        document.body.innerHTML = '<p>Photo not found.</p>';
    } else {
        const photo = obj.photos.find(p => p.id === photoId);
        if(!photo){
            document.body.innerHTML = '<p>Photo not found.</p>';
        } else {
            document.getElementById('photoImg').src = photo.dataUrl;
            document.getElementById('photoDate').textContent = photo.date ? `Date: ${photo.date}` : '';
            document.getElementById('photoDesc').textContent = photo.description ? `Description: ${photo.description}` : '';
        }
    }
}
</script>
</body>
</html>
