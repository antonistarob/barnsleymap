<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Set Object Location</title>
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body { font-family: Arial; margin:0; padding:0; background:#f5f5f5; }
header { 
  background:#f0f0f0; 
  color:black; 
  padding:15px; 
  display:flex; 
  justify-content:space-between; 
  align-items:center; 
}
header h1 { margin:0; cursor:pointer; }
header h1:hover { text-decoration: underline; }
header .auth-buttons button { margin-left:10px; padding:6px 12px; cursor:pointer; }

#map { width: 100%; height: 90vh; }
#saveButton { position:absolute; top:80px; left:20px; z-index:1000; padding:10px 15px; background:#007bff; color:white; border:none; cursor:pointer; border-radius:4px;}
#saveButton:hover { background:#0056b3; }
</style>
</head>
<body>

<header>
  <h1 onclick="goBack()">Set Object Location</h1>
  <div class="auth-buttons">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Log In</button>
  </div>
</header>

<button id="saveButton">Save Location</button>
<div id="map"></div>

<script>
// ---------------- AUTH MOCK ----------------
function signup(){ alert("Sign Up clicked"); }
function login(){ alert("Log In clicked"); }
function goBack(){ window.location.href = "object.html"; }

// ---------------- GET CURRENT OBJECT ----------------
let street = localStorage.getItem("currentStreet");
let index = localStorage.getItem("mapObjectIndex"); // stored before opening this page
let objects = JSON.parse(localStorage.getItem(street + "_objects")) || [];
let obj = objects[index];

if(!obj){
  alert("No object selected!");
  window.location.href = "street.html";
}

// ---------------- INIT MAP ----------------
const savedLocation = JSON.parse(localStorage.getItem(street + "_object_" + index + "_location"));

const map = L.map('map').setView(savedLocation ? [savedLocation.lat, savedLocation.lng] : [53.5526, -1.4820], 17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let marker;
if(savedLocation){
  marker = L.marker([savedLocation.lat, savedLocation.lng], {draggable:true}).addTo(map)
           .bindPopup(obj.name).openPopup();
}

// ---------------- CLICK TO PLACE MARKER ----------------
map.on('click', function(e){
  const latlng = e.latlng;
  if(marker) marker.setLatLng(latlng);
  else marker = L.marker(latlng, {draggable:true}).addTo(map).bindPopup(obj.name).openPopup();
});

// ---------------- SAVE LOCATION ----------------
document.getElementById("saveButton").onclick = function(){
  if(!marker){
    alert("Please click on the map to place the object location.");
    return;
  }
  const latlng = marker.getLatLng();
  localStorage.setItem(street + "_object_" + index + "_location", JSON.stringify({lat:latlng.lat, lng:latlng.lng}));
  alert("Location saved!");
  window.location.href = "object.html";
};
</script>

</body>
</html>
